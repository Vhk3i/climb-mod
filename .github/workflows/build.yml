              public static class MedicalMinigameScreen extends Screen {
                  private final Limb targetLimb;
                  private boolean isSplintGame;

                  private float bandageProgress = 0.0f;
                  private final List<Integer> wrapOffsets = new ArrayList<>();

                  private int currentStrap = 0;
                  private final boolean[] strapsLocked = new boolean[]{false, false, false};
                  private final float[] targetZoneCenters = new float[]{0.35f, 0.68f, 0.50f};
                  private float sliderPos = 0.0f;
                  private float sliderSpeed = 0.032f;
                  private boolean sliderForward = true;
                  private int errorFlashTicks = 0;

                  protected MedicalMinigameScreen(Limb targetLimb, boolean isSplintGame) {
                      super(Component.literal(isSplintGame ? "Наложение шины" : "Перевязка раны"));
                      this.targetLimb = targetLimb;
                      this.isSplintGame = isSplintGame;
                  }

                  @Override
                  public boolean isPauseScreen() {
                      return false;
                  }

                  @Override
                  public void tick() {
                      super.tick();
                      bandageAnimTicks = 10;
                      if (errorFlashTicks > 0) errorFlashTicks--;

                      if (isSplintGame) {
                          if (sliderForward) {
                              sliderPos += sliderSpeed;
                              if (sliderPos >= 1.0f) {
                                  sliderPos = 1.0f;
                                  sliderForward = false;
                              }
                          } else {
                              sliderPos -= sliderSpeed;
                              if (sliderPos <= 0.0f) {
                                  sliderPos = 0.0f;
                                  sliderForward = true;
                              }
                          }
                      }
                  }

                  @Override
                  public boolean mouseDragged(double mouseX, double mouseY, int button, double dragX, double dragY) {
                      if (!isSplintGame && button == 0) {
                          int cx = this.width / 2;
                          int cy = this.height / 2 + 10;
                          if (Math.abs(mouseX - cx) < 135 && Math.abs(mouseY - cy) < 80) {
                              double moveDist = Math.hypot(dragX, dragY);
                              if (moveDist > 1.0) {
                                  bandageProgress = Math.min(100.0f, bandageProgress + (float)(moveDist * 0.28));
                                  int relX = (int) Mth.clamp(mouseX - (cx - 80), 8, 152);
                                  if (wrapOffsets.size() < 28 && (wrapOffsets.isEmpty() || Math.abs(wrapOffsets.get(wrapOffsets.size() - 1) - relX) > 5)) {
                                      wrapOffsets.add(relX);
                                      if (Minecraft.getInstance().player != null) {
                                          Minecraft.getInstance().player.playSound(SoundEvents.WOOL_STEP, 0.5f, 1.35f);
                                      }
                                  }
                                  if (bandageProgress >= 100.0f) {
                                      completeMinigameSuccess();
                                  }
                              }
                          }
                      }
                      return super.mouseDragged(mouseX, mouseY, button, dragX, dragY);
                  }

                  @Override
                  public boolean mouseClicked(double mouseX, double mouseY, int button) {
                      int cx = this.width / 2;
                      int cy = this.height / 2;
                      int y0 = cy - 82;

                      // Кнопка переключения режима внутри окна (Бинт <-> Шина), чтобы всегда можно было протестировать оба режима
                      if (mouseY >= y0 + 4 && mouseY <= y0 + 18 && Math.abs(mouseX - (cx + 95)) <= 26) {
                          this.isSplintGame = !this.isSplintGame;
                          return true;
                      }

                      if (isSplintGame && button == 0 && currentStrap < 3) {
                          float center = targetZoneCenters[currentStrap];
                          float halfWidth = 0.12f;
                          if (Math.abs(sliderPos - center) <= halfWidth) {
                              strapsLocked[currentStrap] = true;
                              currentStrap++;
                              sliderSpeed += 0.012f;
                              if (Minecraft.getInstance().player != null) {
                                  Minecraft.getInstance().player.playSound(SoundEvents.ARMOR_EQUIP_IRON, 0.9f, 1.25f);
                                  Minecraft.getInstance().player.playSound(SoundEvents.SKELETON_STEP, 0.7f, 0.85f);
                              }
                              if (currentStrap >= 3) {
                                  completeMinigameSuccess();
                              }
                          } else {
                              errorFlashTicks = 12;
                              if (Minecraft.getInstance().player != null) {
                                  Minecraft.getInstance().player.playSound(SoundEvents.PLAYER_HURT, 0.7f, 1.1f);
                              }
                          }
                          return true;
                      }
                      return super.mouseClicked(mouseX, mouseY, button);
                  }

                  private void completeMinigameSuccess() {
                      Player player = Minecraft.getInstance().player;
                      if (player != null) {
                          NETWORK.sendToServer(new PacketConsumeClimbItem(0));
                          ClientEvents.finishMinigameHeal(player, targetLimb, isSplintGame);
                      }
                      this.onClose();
                  }

                  @Override
                  public void render(GuiGraphics gui, int mouseX, int mouseY, float partialTick) {
                      this.renderBackground(gui);
                      int cx = this.width / 2;
                      int cy = this.height / 2;

                      int boxW = 256;
                      int boxH = 168;
                      int x0 = cx - boxW / 2;
                      int y0 = cy - boxH / 2;

                      int bgCol = errorFlashTicks > 0 ? 0xE83A0D0D : 0xE80B0F14;
                      int brdCol = isSplintGame ? 0xFFE89825 : 0xFFE63946;
                      gui.fill(x0, y0, x0 + boxW, y0 + boxH, bgCol);
                      gui.renderOutline(x0, y0, boxW, boxH, brdCol);

                      // Кнопка переключения Бинт / Шина в правом верхнем углу мини-игры
                      gui.fill(cx + 68, y0 + 5, cx + 122, y0 + 18, 0xFF1E293B);
                      gui.renderOutline(cx + 68, y0 + 5, 54, 13, 0xFF64748B);
                      gui.drawCenteredString(this.font, isSplintGame ? "§e[К Бинту]" : "§6[К Шине]", cx + 95, y0 + 7, 0xFFFFFF);

                      if (!isSplintGame) {
                          gui.drawCenteredString(this.font, "§c§lПЕРЕВЯЗКА РАНЫ (" + targetLimb.name + ")", cx - 20, y0 + 8, 0xFFFFFF);
                          gui.drawCenteredString(this.font, "§7Зажмите §fЛКМ §7и водите мышью по руке для намотки бинта", cx, y0 + 24, 0xAAAAAA);

                          int armX = cx - 80;
                          int armY = cy - 12;
                          gui.fill(armX, armY, armX + 160, armY + 38, 0xFFD49B7E);
                          gui.renderOutline(armX, armY, 160, 38, 0xFF8C583A);

                          gui.fill(armX + 22, armY + 15, armX + 138, armY + 23, 0xFF9E0B0B);
                          gui.fill(armX + 35, armY + 13, armX + 120, armY + 25, 0xFFD91818);

                          for (int offset : wrapOffsets) {
                              int wx = armX + offset;
                              gui.fill(wx - 6, armY - 3, wx + 6, armY + 41, 0xF2F0F4F8);
                              gui.renderOutline(wx - 6, armY - 3, 12, 44, 0xFFB8C4CE);
                          }

                          gui.fill(mouseX - 8, mouseY - 12, mouseX + 8, mouseY + 12, 0xFFFFFFFF);
                          gui.renderOutline(mouseX - 8, mouseY - 12, 16, 24, 0xFF7A8B99);

                          gui.fill(x0 + 25, y0 + 132, x0 + boxW - 25, y0 + 146, 0xFF161C24);
                          int fillW = (int) ((boxW - 50) * (bandageProgress / 100.0f));
                          gui.fill(x0 + 25, y0 + 132, x0 + 25 + fillW, y0 + 146, 0xFF38E878);
                          gui.renderOutline(x0 + 25, y0 + 132, boxW - 50, 14, 0xFF4A5A6A);
                          gui.drawCenteredString(this.font, String.format("Намотано: %.0f%%", bandageProgress), cx, y0 + 135, 0xFFFFFF);
                      } else {
                          gui.drawCenteredString(this.font, "§6§lНАЛОЖЕНИЕ ШИНЫ (" + targetLimb.name + ")", cx - 20, y0 + 8, 0xFFFFFF);
                          gui.drawCenteredString(this.font, "§7Жмите §fЛКМ §7в зеленой зоне, чтобы затянуть 3 ремня шины", cx, y0 + 24, 0xAAAAAA);

                          int armX = cx - 85;
                          int armY = cy - 18;
                          gui.fill(armX, armY, armX + 170, armY + 42, 0xFF222A34);
                          gui.renderOutline(armX, armY, 170, 42, 0xFF526274);

                          int fractureOffset = (3 - currentStrap) * 4;
                          gui.fill(armX + 12, armY + 16 - fractureOffset, cx - 2, armY + 25 - fractureOffset, 0xFFE2E8F0);
                          gui.fill(cx + 2, armY + 16 + fractureOffset, armX + 158, armY + 25 + fractureOffset, 0xFFE2E8F0);

                          gui.fill(armX + 8, armY + 34, armX + 162, armY + 40, 0xFF94A3B8);

                          for (int s = 0; s < 3; s++) {
                              int sx = armX + 30 + s * 50;
                              int strapCol = strapsLocked[s] ? 0xFF2EC4B6 : (s == currentStrap ? 0xFFF4A261 : 0xFF475569);
                              gui.fill(sx, armY - 4, sx + 14, armY + 46, strapCol);
                              gui.renderOutline(sx, armY - 4, 14, 50, 0xFF0F172A);
                          }

                          int barX = x0 + 25;
                          int barY = y0 + 122;
                          int barW = boxW - 50;
                          gui.fill(barX, barY, barX + barW, barY + 18, 0xFF141A22);

                          if (currentStrap < 3) {
                              float zoneCenter = targetZoneCenters[currentStrap];
                              int zStart = barX + (int) ((zoneCenter - 0.12f) * barW);
                              int zEnd = barX + (int) ((zoneCenter + 0.12f) * barW);
                              gui.fill(zStart, barY, zEnd, barY + 18, 0xAA2EC466);
                              gui.renderOutline(zStart, barY, zEnd - zStart, 18, 0xFF52FF88);
                          }

                          int knobX = barX + (int) (sliderPos * barW);
                          gui.fill(knobX - 3, barY - 4, knobX + 3, barY + 22, 0xFFFFFFFF);
                          gui.renderOutline(barX, barY, barW, 18, 0xFF64748B);
                          gui.drawCenteredString(this.font, "Затянуто ремней: " + currentStrap + " / 3", cx, y0 + 145, 0xE2E8F0);
                      }

                      super.render(gui, mouseX, mouseY, partialTick);
                  }
              }

