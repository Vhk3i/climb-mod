                  private static void tryPlacePitonHotkey(Player player) {
                      if (!hasItemInInventory(player, CLIMBING_PITON.get())) {
                          player.playSound(SoundEvents.ITEM_BREAK, 0.5f, 1.5f);
                          return;
                      }
                      Vec3 eye = player.getEyePosition();
                      Vec3 reach = eye.add(player.getLookAngle().scale(2.1));
                      BlockHitResult hit = player.level().clip(new ClipContext(eye, reach, ClipContext.Block.OUTLINE, ClipContext.Fluid.NONE, player));

                      if (hit.getType() == HitResult.Type.BLOCK) {
                          NETWORK.sendToServer(new PacketConsumeClimbItem(2));
                          placePitonEffectClient(player, hit.getLocation());
                      }
                  }

