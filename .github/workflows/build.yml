name: Build Jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.4 and Generate Full Mod Project
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          export PATH=$PWD/gradle-8.4/bin:$PATH

          mkdir -p mod_build/src/main/java/com/realisticclimbing
          mkdir -p mod_build/src/main/resources/META-INF
          mkdir -p mod_build/src/main/resources/assets/realisticclimbing/models/item
          mkdir -p mod_build/src/main/resources/assets/realisticclimbing/lang
          mkdir -p mod_build/src/main/resources/data/realisticclimbing/recipes
          cd mod_build

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.minecraftforge.net/' }
              }
          }
          rootProject.name = 'realisticclimbing'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }

          version = '1.6.0'
          group = 'com.realisticclimbing'
          base {
              archivesName = 'realisticclimbing-1.20.1'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.20.1'
          }

          repositories {
              maven { url = 'https://maven.minecraftforge.net/' }
              mavenCentral()
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.20'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }

          jar {
              finalizedBy 'reobfJar'
          }
          EOF

          cat << 'EOF' > src/main/resources/META-INF/mods.toml
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"
          [[mods]]
          modId="realisticclimbing"
          version="1.6.0"
          displayName="Realistic Climbing Simulator"
          description="Tarkov-Style Body HUD, Ledge Mantling, Consumable Inventory Medical/Climb Items & 4-Limb IK"
          EOF

          cat << 'EOF' > src/main/resources/pack.mcmeta
          {
              "pack": {
                  "description": "realisticclimbing resources",
                  "pack_format": 15
              }
          }
          EOF

          # Модели предметов (используют встроенные текстуры Minecraft, чтобы всегда отображаться корректно)
          cat << 'EOF' > src/main/resources/assets/realisticclimbing/models/item/climbing_bandage.json
          {
              "parent": "minecraft:item/generated",
              "textures": {
                  "layer0": "minecraft:item/paper"
              }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/realisticclimbing/models/item/chalk_bag.json
          {
              "parent": "minecraft:item/generated",
              "textures": {
                  "layer0": "minecraft:item/sugar"
              }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/realisticclimbing/models/item/climbing_piton.json
          {
              "parent": "minecraft:item/handheld",
              "textures": {
                  "layer0": "minecraft:item/tripwire_hook"
              }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/realisticclimbing/lang/ru_ru.json
          {
              "item.realisticclimbing.climbing_bandage": "Перевязочный пакет и шина (ИПП)",
              "item.realisticclimbing.chalk_bag": "Мешочек с магнезией",
              "item.realisticclimbing.climbing_piton": "Скальный страховочный крюк"
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/realisticclimbing/lang/en_us.json
          {
              "item.realisticclimbing.climbing_bandage": "Tactical Bandage & Splint",
              "item.realisticclimbing.chalk_bag": "Climbing Chalk Bag",
              "item.realisticclimbing.climbing_piton": "Steel Climbing Piton"
          }
          EOF

          # Рецепты крафта для выживания
          cat << 'EOF' > src/main/resources/data/realisticclimbing/recipes/climbing_bandage.json
          {
              "type": "minecraft:crafting_shaped",
              "pattern": [
                  "WW",
                  "SS"
              ],
              "key": {
                  "W": { "tag": "minecraft:wool" },
                  "S": { "item": "minecraft:stick" }
              },
              "result": {
                  "item": "realisticclimbing:climbing_bandage",
                  "count": 2
              }
          }
          EOF

          cat << 'EOF' > src/main/resources/data/realisticclimbing/recipes/chalk_bag.json
          {
              "type": "minecraft:crafting_shaped",
              "pattern": [
                  "BBB",
                  " L "
              ],
              "key": {
                  "B": { "item": "minecraft:bone_meal" },
                  "L": { "item": "minecraft:leather" }
              },
              "result": {
                  "item": "realisticclimbing:chalk_bag",
                  "count": 1
              }
          }
          EOF

          cat << 'EOF' > src/main/resources/data/realisticclimbing/recipes/climbing_piton.json
          {
              "type": "minecraft:crafting_shaped",
              "pattern": [
                  " I",
                  "NN"
              ],
              "key": {
                  "I": { "item": "minecraft:iron_ingot" },
                  "N": { "item": "minecraft:iron_nugget" }
              },
              "result": {
                  "item": "realisticclimbing:climbing_piton",
                  "count": 3
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/realisticclimbing/RealisticClimbingMod.java
          package com.realisticclimbing;

          import com.mojang.blaze3d.systems.RenderSystem;
          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.blaze3d.vertex.VertexConsumer;
          import com.mojang.math.Axis;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.model.PlayerModel;
          import net.minecraft.client.model.geom.ModelPart;
          import net.minecraft.client.player.AbstractClientPlayer;
          import net.minecraft.client.renderer.LevelRenderer;
          import net.minecraft.client.renderer.MultiBufferSource;
          import net.minecraft.client.renderer.RenderType;
          import net.minecraft.client.renderer.entity.player.PlayerRenderer;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.core.particles.BlockParticleOption;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.network.FriendlyByteBuf;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.util.Mth;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResultHolder;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.CreativeModeTabs;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.UseAnim;
          import net.minecraft.world.level.ClipContext;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.LightLayer;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.BlockHitResult;
          import net.minecraft.world.phys.HitResult;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.RegisterKeyMappingsEvent;
          import net.minecraftforge.client.event.RenderGuiOverlayEvent;
          import net.minecraftforge.client.event.RenderHandEvent;
          import net.minecraftforge.client.event.RenderLevelStageEvent;
          import net.minecraftforge.client.event.RenderPlayerEvent;
          import net.minecraftforge.client.gui.overlay.VanillaGuiOverlay;
          import net.minecraftforge.common.MinecraftForge;
          import net.minecraftforge.event.BuildCreativeModeTabContentsEvent;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          import net.minecraftforge.fml.loading.FMLEnvironment;
          import net.minecraftforge.network.NetworkEvent;
          import net.minecraftforge.network.NetworkRegistry;
          import net.minecraftforge.network.simple.SimpleChannel;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;
          import org.joml.Matrix4f;
          import org.lwjgl.glfw.GLFW;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.function.Supplier;

          @Mod("realisticclimbing")
          public class RealisticClimbingMod {
              public static final String MOD_ID = "realisticclimbing";

              // Регистрация реальных предметов в инвентаре
              public static final DeferredRegister<Item> ITEMS = DeferredRegister.create(ForgeRegistries.ITEMS, MOD_ID);

              public static final RegistryObject<Item> CLIMBING_BANDAGE = ITEMS.register("climbing_bandage",
                      () -> new BandageItem(new Item.Properties().stacksTo(16)));

              public static final RegistryObject<Item> CHALK_BAG = ITEMS.register("chalk_bag",
                      () -> new ChalkBagItem(new Item.Properties().durability(8)));

              public static final RegistryObject<Item> CLIMBING_PITON = ITEMS.register("climbing_piton",
                      () -> new PitonItem(new Item.Properties().stacksTo(16)));

              // Сетевой канал для честного списания предметов на сервере при нажатии хоткеев G / V / B
              private static final String PROTOCOL_VERSION = "1";
              public static final SimpleChannel NETWORK = NetworkRegistry.newSimpleChannel(
                      new ResourceLocation(MOD_ID, "main"),
                      () -> PROTOCOL_VERSION,
                      PROTOCOL_VERSION::equals,
                      PROTOCOL_VERSION::equals
              );

              public static KeyMapping KEY_TOGGLE_CLIMB;
              public static KeyMapping KEY_LEFT_HAND;
              public static KeyMapping KEY_RIGHT_HAND;
              public static KeyMapping KEY_LEFT_FOOT;
              public static KeyMapping KEY_RIGHT_FOOT;
              public static KeyMapping KEY_USE_CHALK;
              public static KeyMapping KEY_PLACE_PITON;
              public static KeyMapping KEY_BANDAGE;

              public static boolean climbingActive = false;
              public static float stamina = 100.0f;
              public static float stability = 1.0f;

              // Система перелезания на горизонтальную поверхность (Ledge Mantle на Пробел)
              public static boolean mantlingActive = false;
              public static int mantleTicks = 0;
              public static final int MAX_MANTLE_TICKS = 18;
              public static Vec3 mantleStartPos = Vec3.ZERO;
              public static Vec3 mantleTargetPos = Vec3.ZERO;
              public static Vec3 mantleLeftHandPos = Vec3.ZERO;
              public static Vec3 mantleRightHandPos = Vec3.ZERO;

              // Таймеры процедурных анимаций
              public static int chalkAnimTicks = 0;
              public static int pitonAnimTicks = 0;
              public static int fallFlailTicks = 0;
              public static int pullUpAnimTicks = 0;
              public static int bandageAnimTicks = 0;

              public static float chalkLevel = 100.0f;
              public static float headHealth = 100.0f;
              public static float thoraxHealth = 100.0f;
              public static float stomachHealth = 100.0f;
              public static float bloodLoss = 0.0f;
              public static double prevFallSpeed = 0.0;
              public static Vec3 lastPitonStrikePos = Vec3.ZERO;

              public static final List<Vec3> PLACED_PITONS = new ArrayList<>();
              public static boolean hangingOnRope = false;
              public static double maxRopeSlack = 3.8;

              public static Vec3 currentWind = Vec3.ZERO;
              public static float windSpeed = 0.0f;
              public static float pressureKPa = 101.3f;
              public static float hypoxiaFactor = 0.0f;
              public static int gustTimer = 0;
              public static boolean isGusting = false;
              public static float lockedWallYaw = 0.0f;

              public static class Limb {
                  public final String name;
                  public final boolean isHand;
                  public final boolean isLeft;
                  public boolean locked = false;
                  public boolean reaching = false;
                  public float moveProgress = 1.0f;
                  public Vec3 startPos = Vec3.ZERO;
                  public Vec3 prevPos = Vec3.ZERO;
                  public Vec3 currentPos = Vec3.ZERO;
                  public Vec3 targetPos = Vec3.ZERO;
                  public Vec3 elbowOrKneePos = Vec3.ZERO;
                  public float gripQuality = 1.0f;

                  public float health = 100.0f;
                  public boolean bleeding = false;
                  public boolean dislocated = false;
                  public boolean fractured = false;

                  public Limb(String name, boolean isHand, boolean isLeft) {
                      this.name = name;
                      this.isHand = isHand;
                      this.isLeft = isLeft;
                  }

                  public Vec3 getRenderPos(float partialTick) {
                      return prevPos.lerp(currentPos, partialTick);
                  }

                  public float getEffectiveness() {
                      if (fractured || health < 20.0f) return 0.0f;
                      float eff = health / 100.0f;
                      if (dislocated) eff *= 0.45f;
                      if (bleeding) eff *= 0.75f;
                      return Mth.clamp(eff, 0.1f, 1.0f);
                  }
              }

              public static final Limb[] LIMBS = new Limb[]{
                      new Limb("Левая рука", true, true),
                      new Limb("Правая рука", true, false),
                      new Limb("Левая нога", false, true),
                      new Limb("Правая нога", false, false)
              };

              public RealisticClimbingMod() {
                  IEventBus modBus = FMLJavaModLoadingContext.get().getModEventBus();
                  ITEMS.register(modBus);
                  modBus.addListener(this::addCreativeTabItems);

                  NETWORK.registerMessage(0, PacketConsumeClimbItem.class,
                          PacketConsumeClimbItem::encode,
                          PacketConsumeClimbItem::decode,
                          PacketConsumeClimbItem::handle);

                  if (FMLEnvironment.dist == Dist.CLIENT) {
                      modBus.addListener(ClientEvents::registerKeys);
                      MinecraftForge.EVENT_BUS.register(ClientEvents.class);
                  }
              }

              private void addCreativeTabItems(BuildCreativeModeTabContentsEvent event) {
                  if (event.getTabKey() == CreativeModeTabs.TOOLS_AND_UTILITIES || event.getTabKey() == CreativeModeTabs.COMBAT) {
                      event.accept(CLIMBING_BANDAGE);
                      event.accept(CHALK_BAG);
                      event.accept(CLIMBING_PITON);
                  }
              }

              // =========================================================================
              // РЕАЛЬНЫЕ ПРЕДМЕТЫ В ИНВЕНТАРЕ И СЕТЕВОЙ ПАКЕТ СПИСАНИЯ
              // =========================================================================
              public static class BandageItem extends Item {
                  public BandageItem(Properties props) { super(props); }

                  @Override
                  public int getUseDuration(ItemStack stack) { return 28; }

                  @Override
                  public UseAnim getUseAnimation(ItemStack stack) { return UseAnim.BOW; }

                  @Override
                  public InteractionResultHolder<ItemStack> use(Level level, Player player, InteractionHand hand) {
                      ItemStack stack = player.getItemInHand(hand);
                      if (level.isClientSide && !ClientEvents.hasAnyInjury()) {
                          return InteractionResultHolder.fail(stack);
                      }
                      if (level.isClientSide) {
                          bandageAnimTicks = 28;
                      }
                      player.startUsingItem(hand);
                      return InteractionResultHolder.consume(stack);
                  }

                  @Override
                  public ItemStack finishUsingItem(ItemStack stack, Level level, LivingEntity entity) {
                      if (entity instanceof Player player) {
                          if (level.isClientSide) {
                              ClientEvents.healWorstInjuryClient(player);
                          }
                          if (!player.getAbilities().instabuild) {
                              stack.shrink(1);
                          }
                      }
                      return stack;
                  }
              }

              public static class ChalkBagItem extends Item {
                  public ChalkBagItem(Properties props) { super(props); }

                  @Override
                  public InteractionResultHolder<ItemStack> use(Level level, Player player, InteractionHand hand) {
                      ItemStack stack = player.getItemInHand(hand);
                      if (level.isClientSide) {
                          ClientEvents.applyChalkEffectsClient(player);
                      } else if (!player.getAbilities().instabuild) {
                          stack.hurtAndBreak(1, player, p -> p.broadcastBreakEvent(hand));
                      }
                      return InteractionResultHolder.sidedSuccess(stack, level.isClientSide());
                  }
              }

              public static class PitonItem extends Item {
                  public PitonItem(Properties props) { super(props); }

                  @Override
                  public InteractionResultHolder<ItemStack> use(Level level, Player player, InteractionHand hand) {
                      ItemStack stack = player.getItemInHand(hand);
                      Vec3 eye = player.getEyePosition();
                      Vec3 reach = eye.add(player.getLookAngle().scale(2.1));
                      BlockHitResult hit = level.clip(new ClipContext(eye, reach, ClipContext.Block.OUTLINE, ClipContext.Fluid.NONE, player));

                      if (hit.getType() == HitResult.Type.BLOCK) {
                          if (level.isClientSide) {
                              ClientEvents.placePitonEffectClient(player, hit.getLocation());
                          } else if (!player.getAbilities().instabuild) {
                              stack.shrink(1);
                          }
                          return InteractionResultHolder.sidedSuccess(stack, level.isClientSide());
                      }
                      return InteractionResultHolder.fail(stack);
                  }
              }

              public static class PacketConsumeClimbItem {
                  private final int itemType; // 0 = Бинт, 1 = Магнезия, 2 = Крюк

                  public PacketConsumeClimbItem(int itemType) {
                      this.itemType = itemType;
                  }

                  public static void encode(PacketConsumeClimbItem msg, FriendlyByteBuf buf) {
                      buf.writeInt(msg.itemType);
                  }

                  public static PacketConsumeClimbItem decode(FriendlyByteBuf buf) {
                      return new PacketConsumeClimbItem(buf.readInt());
                  }

                  public static void handle(PacketConsumeClimbItem msg, Supplier<NetworkEvent.Context> ctx) {
                      ctx.get().enqueueWork(() -> {
                          ServerPlayer player = ctx.get().getSender();
                          if (player == null || player.getAbilities().instabuild) return;

                          Item targetItem = msg.itemType == 0 ? CLIMBING_BANDAGE.get()
                                  : (msg.itemType == 1 ? CHALK_BAG.get() : CLIMBING_PITON.get());

                          for (int i = 0; i < player.getInventory().getContainerSize(); i++) {
                              ItemStack stack = player.getInventory().getItem(i);
                              if (stack.is(targetItem)) {
                                  if (msg.itemType == 1) {
                                      stack.hurtAndBreak(1, player, p -> {});
                                  } else {
                                      stack.shrink(1);
                                  }
                                  player.inventoryMenu.broadcastChanges();
                                  break;
                              }
                          }
                      });
                      ctx.get().setPacketHandled(true);
                  }
              }

              // =========================================================================
              // КЛИЕНТСКАЯ ФИЗИКА, MANTLE НА УСТУП И ТАРКОВСКИЙ 3D/GUI ХУД
              // =========================================================================
              public static class ClientEvents {
                  public static void registerKeys(RegisterKeyMappingsEvent event) {
                      KEY_TOGGLE_CLIMB = new KeyMapping("Вкл/Выкл Скалолазание", GLFW.GLFW_KEY_R, "Realistic Climbing");
                      KEY_LEFT_HAND = new KeyMapping("Перехват: Левая рука", GLFW.GLFW_KEY_Q, "Realistic Climbing");
                      KEY_RIGHT_HAND = new KeyMapping("Перехват: Правая рука", GLFW.GLFW_KEY_E, "Realistic Climbing");
                      KEY_LEFT_FOOT = new KeyMapping("Опора: Левая нога", GLFW.GLFW_KEY_Z, "Realistic Climbing");
                      KEY_RIGHT_FOOT = new KeyMapping("Опора: Правая нога", GLFW.GLFW_KEY_C, "Realistic Climbing");
                      KEY_USE_CHALK = new KeyMapping("Нанести магнезию (Мел)", GLFW.GLFW_KEY_G, "Realistic Climbing");
                      KEY_PLACE_PITON = new KeyMapping("Забить страховочный крюк", GLFW.GLFW_KEY_V, "Realistic Climbing");
                      KEY_BANDAGE = new KeyMapping("Перевязать рану / Наложить шину", GLFW.GLFW_KEY_B, "Realistic Climbing");

                      event.register(KEY_TOGGLE_CLIMB);
                      event.register(KEY_LEFT_HAND);
                      event.register(KEY_RIGHT_HAND);
                      event.register(KEY_LEFT_FOOT);
                      event.register(KEY_RIGHT_FOOT);
                      event.register(KEY_USE_CHALK);
                      event.register(KEY_PLACE_PITON);
                      event.register(KEY_BANDAGE);
                  }

                  @SubscribeEvent
                  public static void onPlayerTick(TickEvent.PlayerTickEvent event) {
                      if (event.phase != TickEvent.Phase.END) return;
                      Player player = event.player;
                      Minecraft mc = Minecraft.getInstance();
                      if (player != mc.player) return;

                      for (Limb l : LIMBS) {
                          l.prevPos = l.currentPos;
                      }

                      if (chalkAnimTicks > 0) chalkAnimTicks--;
                      if (pitonAnimTicks > 0) pitonAnimTicks--;
                      if (pullUpAnimTicks > 0) pullUpAnimTicks--;
                      if (bandageAnimTicks > 0) bandageAnimTicks--;
                      if (fallFlailTicks > 0) {
                          fallFlailTicks--;
                          if (player.onGround() || climbingActive || mantlingActive) fallFlailTicks = 0;
                      }

                      updateAtmosphereAndWind(player);
                      updateMedicalAndInjuries(player);

                      // Если сейчас выполняется подтягивание и выход силой на горизонтальный уступ (Mantle)
                      if (mantlingActive) {
                          updateLedgeMantle(player);
                          return;
                      }

                      while (KEY_BANDAGE.consumeClick()) {
                          tryUseBandageHotkey(player);
                      }

                      while (KEY_USE_CHALK.consumeClick()) {
                          tryUseChalkHotkey(player);
                      }

                      while (KEY_PLACE_PITON.consumeClick()) {
                          tryPlacePitonHotkey(player);
                      }

                      while (KEY_TOGGLE_CLIMB.consumeClick()) {
                          if (!climbingActive) {
                              if (tryEngageWall(player)) {
                                  climbingActive = true;
                                  hangingOnRope = false;
                                  fallFlailTicks = 0;
                              }
                          } else {
                              disengageClimb(player, false);
                          }
                      }

                      // Позволяем забраться на высокий уступ с земли/прыжка по Пробелу, если руки целы
                      if (!climbingActive && !player.onGround() && mc.options.keyJump.isDown() && player.zza > 0) {
                          if (tryStartLedgeMantle(player)) {
                              return;
                          }
                      }

                      if (!climbingActive) {
                          float recoveryRate = 0.45f * (1.0f - hypoxiaFactor * 0.60f) * (1.0f - bloodLoss * 0.005f);
                          stamina = Math.min(100.0f, stamina + Math.max(0.05f, recoveryRate));
                          updateRopeArrestPhysics(player);
                          return;
                      }

                      // ПРОВЕРКА ПРОБЕЛА НА СТЕНЕ: ЗАБИРАНИЕ НА РОВНУЮ ГОРИЗОНТАЛЬНУЮ ПОВЕРХНОСТЬ (LEDGE MANTLE)
                      if (mc.options.keyJump.isDown()) {
                          if (tryStartLedgeMantle(player)) {
                              return;
                          }
                      }

                      handleLimbInput(player, 0, KEY_LEFT_HAND);
                      handleLimbInput(player, 1, KEY_RIGHT_HAND);
                      handleLimbInput(player, 2, KEY_LEFT_FOOT);
                      handleLimbInput(player, 3, KEY_RIGHT_FOOT);

                      float sweatRate = player.level().isRaining() ? 0.22f : 0.07f;
                      chalkLevel = Math.max(0.0f, chalkLevel - sweatRate);

                      int lockedCount = 0;
                      int handsLocked = 0;
                      Vec3 centerOfSupport = Vec3.ZERO;

                      double chalkBonus = (chalkLevel / 100.0) * 0.12;

                      for (int i = 0; i < 4; i++) {
                          Limb limb = LIMBS[i];
                          Vec3 rootPos = getJointRoot(player, limb, 1.0f);

                          if (limb.fractured || limb.health < 20.0f) {
                              limb.fractured = true;
                              limb.locked = false;
                          }

                          if (limb.moveProgress < 1.0f) {
                              float speed = 0.20f * Math.max(0.45f, limb.getEffectiveness());
                              limb.moveProgress = Math.min(1.0f, limb.moveProgress + speed);
                              Vec3 baseLerp = limb.startPos.lerp(limb.targetPos, limb.moveProgress);
                              Vec3 wallOut = Vec3.directionFromRotation(0, lockedWallYaw).scale(-Math.sin(limb.moveProgress * Math.PI) * 0.30);
                              limb.currentPos = baseLerp.add(wallOut);
                              if (limb.moveProgress >= 1.0f) {
                                  limb.reaching = false;
                                  player.playSound(SoundEvents.STONE_STEP, 0.35f, limb.isHand ? 1.3f : 0.9f);
                              }
                          } else if (limb.locked) {
                              limb.currentPos = limb.currentPos.lerp(limb.targetPos, 0.55);
                          } else {
                              Vec3 hangOffset = new Vec3(0, limb.isHand ? -0.35 : -0.65, 0);
                              limb.currentPos = limb.currentPos.lerp(rootPos.add(hangOffset), 0.25);
                          }

                          limb.elbowOrKneePos = solveTwoBoneIK(rootPos, limb.currentPos, limb.isHand, limb.isLeft);

                          double limbMaxStretch = (1.62 - (hypoxiaFactor * 0.22) + chalkBonus) * (0.65 + 0.35 * limb.getEffectiveness());

                          if (limb.locked && rootPos.distanceTo(limb.currentPos) > limbMaxStretch) {
                              limb.locked = false;
                              inflictLimbRipInjury(player, limb);
                          }

                          float slipChance = (chalkLevel < 15.0f ? 0.006f : 0.0f) + (limb.bleeding ? 0.008f : 0.0f) + (limb.dislocated ? 0.006f : 0.0f);
                          if (limb.locked && limb.isHand && slipChance > 0.0f && (windSpeed > 10.0f || stamina < 50.0f)) {
                              if (player.level().random.nextFloat() < slipChance) {
                                  limb.locked = false;
                                  inflictSkinAbrasion(player, limb);
                              }
                          }

                          if (limb.locked) {
                              lockedCount++;
                              if (limb.isHand) handsLocked++;
                              centerOfSupport = centerOfSupport.add(limb.currentPos);
                          }
                      }

                      if (lockedCount == 1 && windSpeed > 11.0f && player.level().random.nextFloat() < 0.015f) {
                          for (Limb l : LIMBS) {
                              if (l.locked && !l.dislocated) {
                                  l.dislocated = true;
                                  l.health = Math.max(25.0f, l.health - 22.0f);
                                  player.playSound(SoundEvents.SKELETON_HURT, 0.9f, 0.65f);
                              }
                          }
                      }

                      if (lockedCount < 2 || handsLocked == 0) {
                          disengageClimb(player, true);
                          return;
                      }

                      centerOfSupport = centerOfSupport.scale(1.0 / lockedCount);

                      float totalLimbEff = 0.0f;
                      for (Limb l : LIMBS) if (l.locked) totalLimbEff += l.getEffectiveness();

                      float gripResistance = (lockedCount == 4) ? 0.25f : (lockedCount == 3 ? 0.75f : 1.45f);
                      float windInstability = (windSpeed / 28.0f) * gripResistance;
                      float chalkStabilityBonus = (chalkLevel / 100.0f) * 0.12f;

                      stability = Mth.clamp(
                              (totalLimbEff / 4.0f) - (float)(player.position().distanceTo(centerOfSupport) * 0.15f) - windInstability + chalkStabilityBonus,
                              0.0f, 1.0f
                      );

                      float chalkStaminaFactor = 1.25f - (chalkLevel / 100.0f) * 0.45f;
                      float injuryPainMultiplier = 1.0f + ((4.0f - totalLimbEff) * 0.35f) + (bloodLoss * 0.01f);
                      float altitudeMultiplier = 1.0f + (hypoxiaFactor * 1.8f);
                      float windStrain = (windSpeed * 0.004f) * gripResistance;
                      float drain = ((4 - lockedCount) * 0.16f + 0.035f + windStrain) * altitudeMultiplier * chalkStaminaFactor * injuryPainMultiplier;
                      stamina = Math.max(0.0f, stamina - drain);

                      if (isGusting && windSpeed > 15.0f && lockedCount <= 2) {
                          player.setDeltaMovement(currentWind.scale(0.85).add(0, -0.2, 0));
                          disengageClimb(player, true);
                          return;
                      }

                      if (stamina <= 0.0f || stability < 0.10f) {
                          player.setDeltaMovement(currentWind.scale(0.45));
                          disengageClimb(player, true);
                          return;
                      }

                      Vec3 lookDir = Vec3.directionFromRotation(0, lockedWallYaw);
                      Vec3 idealBodyPos = centerOfSupport.subtract(lookDir.scale(0.42)).add(0, -0.85, 0);

                      Vec3 sideDir = lookDir.cross(new Vec3(0, 1, 0)).normalize();
                      double swayUp = (player.zza * 0.18);
                      double swaySide = (-player.xxa * 0.18);
                      if (player.zza > 0.1f && pullUpAnimTicks == 0) pullUpAnimTicks = 10;

                      double painTremor = (stamina < 35f || hypoxiaFactor > 0.45f || bloodLoss > 20f)
                              ? Math.sin(player.tickCount * 0.65) * (0.025 + hypoxiaFactor * 0.03 + bloodLoss * 0.001)
                              : 0.0;

                      Vec3 windPushOffset = currentWind.scale(0.55 * gripResistance);

                      Vec3 desiredPelvis = idealBodyPos
                              .add(sideDir.scale(swaySide))
                              .add(0, swayUp + painTremor, 0)
                              .add(windPushOffset);

                      Vec3 velocity = desiredPelvis.subtract(player.position()).scale(0.28);

                      player.setDeltaMovement(velocity);
                      player.fallDistance = 0.0f;

                      player.yBodyRot = lockedWallYaw;
                      player.yBodyRotO = lockedWallYaw;

                      if (windSpeed > 8.0f && player.tickCount % 2 == 0) {
                          Vec3 pPos = player.getEyePosition().add(
                                  (player.level().random.nextDouble() - 0.5) * 3.0,
                                  (player.level().random.nextDouble() - 0.5) * 2.0,
                                  (player.level().random.nextDouble() - 0.5) * 3.0
                          );
                          player.level().addParticle(
                                  player.getY() > 130 ? ParticleTypes.SNOWFLAKE : ParticleTypes.CLOUD,
                                  pPos.x, pPos.y, pPos.z,
                                  currentWind.x * 1.4, currentWind.y * 0.5, currentWind.z * 1.4
                          );
                      }

                      if (isGusting && gustTimer == 58) {
                          player.playSound(SoundEvents.ELYTRA_FLYING, 0.45f, 1.6f);
                      }
                  }

                  // =========================================================================
                  // МЕХАНИКА ЗАБИРАНИЯ НА РОВНУЮ ГОРИЗОНТАЛЬНУЮ ПОВЕРХНОСТЬ (MANTLE / VAULT)
                  // =========================================================================
                  private static boolean tryStartLedgeMantle(Player player) {
                      if (LIMBS[0].fractured && LIMBS[1].fractured) return false;
                      if (stamina < 12.0f) return false;

                      float yaw = climbingActive ? lockedWallYaw : player.getYRot();
                      Vec3 forward = Vec3.directionFromRotation(0, yaw).normalize();
                      Vec3 right = forward.cross(new Vec3(0, 1, 0)).normalize();
                      Level level = player.level();

                      // Ищем горизонтальную полку/вершину стены перед грудью или головой игрока
                      for (double h = 0.2; h <= 2.3; h += 0.35) {
                          Vec3 checkWall = player.position().add(0, h, 0).add(forward.scale(0.75));
                          BlockPos ledgeBlock = BlockPos.containing(checkWall);
                          BlockState wallState = level.getBlockState(ledgeBlock);

                          if (!wallState.isAir() && wallState.isSolidRender(level, ledgeBlock)) {
                              BlockPos above1 = ledgeBlock.above();
                              BlockPos above2 = above1.above();
                              // Проверяем, что над блоком стены свободно 2 блока для выхода в полный рост
                              if (!level.getBlockState(above1).isSolidRender(level, above1)
                                      && !level.getBlockState(above2).isSolidRender(level, above2)) {

                                  mantlingActive = true;
                                  climbingActive = false;
                                  hangingOnRope = false;
                                  mantleTicks = 0;
                                  lockedWallYaw = yaw;
                                  mantleStartPos = player.position();
                                  mantleTargetPos = new Vec3(
                                          ledgeBlock.getX() + 0.5,
                                          ledgeBlock.getY() + 1.02,
                                          ledgeBlock.getZ() + 0.5
                                  );

                                  // Ставим обе ладони ровно на край горизонтального уступа для упора
                                  Vec3 edgeCenter = new Vec3(ledgeBlock.getX() + 0.5, ledgeBlock.getY() + 1.0, ledgeBlock.getZ() + 0.5)
                                          .subtract(forward.scale(0.35));
                                  mantleLeftHandPos = edgeCenter.add(right.scale(-0.32));
                                  mantleRightHandPos = edgeCenter.add(right.scale(0.32));

                                  LIMBS[0].currentPos = LIMBS[0].prevPos = mantleLeftHandPos;
                                  LIMBS[1].currentPos = LIMBS[1].prevPos = mantleRightHandPos;

                                  stamina = Math.max(0.0f, stamina - 10.0f);
                                  player.playSound(SoundEvents.ARMOR_EQUIP_LEATHER, 0.9f, 0.95f);
                                  player.playSound(SoundEvents.STONE_STEP, 0.7f, 1.1f);
                                  return true;
                              }
                          }
                      }
                      return false;
                  }

                  private static void updateLedgeMantle(Player player) {
                      mantleTicks++;
                      float t = (float) mantleTicks / MAX_MANTLE_TICKS;

                      // Первые 60% анимации — мощный выход силой вверх на руках, последние 40% — перенос тела вперед на плоскость
                      double yProgress = Mth.clamp(t * 1.45, 0.0, 1.0);
                      yProgress = 1.0 - Math.pow(1.0 - yProgress, 2.0); // Ease-out вверх
                      double xzProgress = Mth.clamp((t - 0.25) / 0.75, 0.0, 1.0);

                      double curX = Mth.lerp(xzProgress, mantleStartPos.x, mantleTargetPos.x);
                      double curY = Mth.lerp(yProgress, mantleStartPos.y, mantleTargetPos.y);
                      double curZ = Mth.lerp(xzProgress, mantleStartPos.z, mantleTargetPos.z);

                      Vec3 nextPos = new Vec3(curX, curY, curZ);
                      player.setDeltaMovement(nextPos.subtract(player.position()));
                      player.fallDistance = 0.0f;

                      // Ладони остаются прижатыми к кромке уступа во время выхода силой
                      LIMBS[0].currentPos = mantleLeftHandPos;
                      LIMBS[1].currentPos = mantleRightHandPos;

                      if (mantleTicks >= MAX_MANTLE_TICKS) {
                          mantlingActive = false;
                          player.setPos(mantleTargetPos.x, mantleTargetPos.y, mantleTargetPos.z);
                          player.setDeltaMovement(Vec3.directionFromRotation(0, lockedWallYaw).scale(0.15));
                          for (Limb l : LIMBS) l.locked = false;
                          player.playSound(SoundEvents.STONE_STEP, 0.8f, 1.0f);
                      }
                  }

                  // =========================================================================
                  // ИСПОЛЬЗОВАНИЕ И РЕАЛЬНОЕ СПИСАНИЕ ПРЕДМЕТОВ ИЗ ИНВЕНТАРЯ
                  // =========================================================================
                  private static boolean hasItemInInventory(Player player, Item item) {
                      if (player.getAbilities().instabuild) return true;
                      for (int i = 0; i < player.getInventory().getContainerSize(); i++) {
                          if (player.getInventory().getItem(i).is(item)) return true;
                      }
                      return false;
                  }

                  public static boolean hasAnyInjury() {
                      if (headHealth < 99f || thoraxHealth < 99f || stomachHealth < 99f) return true;
                      for (Limb l : LIMBS) {
                          if (l.bleeding || l.dislocated || l.fractured || l.health < 99f) return true;
                      }
                      return false;
                  }

                  private static void tryUseBandageHotkey(Player player) {
                      if (!hasAnyInjury()) return;
                      if (!hasItemInInventory(player, CLIMBING_BANDAGE.get())) {
                          player.playSound(SoundEvents.ITEM_BREAK, 0.5f, 1.5f);
                          return;
                      }
                      NETWORK.sendToServer(new PacketConsumeClimbItem(0));
                      healWorstInjuryClient(player);
                  }

                  public static void healWorstInjuryClient(Player player) {
                      bandageAnimTicks = 30;
                      Limb worstLimb = null;
                      float lowestScore = 1000.0f;

                      for (Limb l : LIMBS) {
                          float score = l.health - (l.fractured ? 60f : 0f) - (l.bleeding ? 40f : 0f) - (l.dislocated ? 30f : 0f);
                          if ((l.bleeding || l.dislocated || l.fractured || l.health < 99.0f) && score < lowestScore) {
                              lowestScore = score;
                              worstLimb = l;
                          }
                      }

                      if (worstLimb != null) {
                          boolean hadBoneInjury = worstLimb.fractured || worstLimb.dislocated;
                          worstLimb.bleeding = false;
                          worstLimb.dislocated = false;
                          worstLimb.fractured = false;
                          worstLimb.health = Math.min(100.0f, Math.max(70.0f, worstLimb.health + 50.0f));
                          if (hadBoneInjury) player.playSound(SoundEvents.SKELETON_STEP, 0.8f, 0.75f);
                      } else {
                          headHealth = Math.min(100.0f, headHealth + 40.0f);
                          thoraxHealth = Math.min(100.0f, thoraxHealth + 40.0f);
                          stomachHealth = Math.min(100.0f, stomachHealth + 40.0f);
                      }

                      bloodLoss = Math.max(0.0f, bloodLoss - 35.0f);
                      player.playSound(SoundEvents.WOOL_PLACE, 0.9f, 1.2f);
                  }

                  private static void tryUseChalkHotkey(Player player) {
                      if (!hasItemInInventory(player, CHALK_BAG.get())) {
                          player.playSound(SoundEvents.ITEM_BREAK, 0.5f, 1.5f);
                          return;
                      }
                      NETWORK.sendToServer(new PacketConsumeClimbItem(1));
                      applyChalkEffectsClient(player);
                  }

                  public static void applyChalkEffectsClient(Player player) {
                      chalkLevel = 100.0f;
                      chalkAnimTicks = 24;
                      stamina = Math.min(100.0f, stamina + 8.0f);
                      player.playSound(SoundEvents.SAND_STEP, 0.8f, 1.5f);

                      for (int i = 0; i < 14; i++) {
                          Vec3 handPos = climbingActive ? LIMBS[i % 2].currentPos : player.getEyePosition().add(player.getLookAngle().scale(0.5));
                          player.level().addParticle(
                                  ParticleTypes.CLOUD,
                                  handPos.x + (player.level().random.nextDouble() - 0.5) * 0.35,
                                  handPos.y + (player.level().random.nextDouble() - 0.5) * 0.35,
                                  handPos.z + (player.level().random.nextDouble() - 0.5) * 0.35,
                                  0.0, 0.03, 0.0
                          );
                      }
                  }

                  private static void tryPlacePitonHotkey(Player player) {
                      if (!hasItemInInventory(player, CLIMBING_PITON.get())) {
                          player.playSound(SoundEvents.ITEM_BREAK, 0.5f, 1.5f);
                          return;
                      }
                      Vec3 eye = player.getEyePosition();
                      Vec3 reach = eye.add(player.getLookAngle().scale(2.1));
                      BlockHitResult hit = player.level().clip(new ClipContext(eye, reach, ClipContext.Block.OUTLINE, ClipContext.Fluid.NONE, player));

                      if (hit.getType() == HitResult.Type.BLOCK) {
                          NETWORK.sendToServer(new PacketConsumeClimbItem(2));
                          placePitonEffectClient(player, hit.getLocation());
                      }
                  }

                  public static void placePitonEffectClient(Player player, Vec3 pitonPos) {
                      PLACED_PITONS.add(pitonPos);
                      lastPitonStrikePos = pitonPos;
                      pitonAnimTicks = 18;
                      player.playSound(SoundEvents.ANVIL_PLACE, 0.7f, 1.75f);

                      for (int i = 0; i < 10; i++) {
                          player.level().addParticle(
                                  ParticleTypes.CRIT,
                                  pitonPos.x, pitonPos.y, pitonPos.z,
                                  (player.level().random.nextDouble() - 0.5) * 0.25,
                                  0.12,
                                  (player.level().random.nextDouble() - 0.5) * 0.25
                          );
                      }
                  }

                  // =========================================================================
                  // ТАРКОВСКИЙ ГРАФИЧЕСКИЙ 3D/GUI ХУД ЗДОРОВЬЯ (БЕЗ ТЕКСТА, ЛЕВЫЙ ВЕРХНИЙ УГОЛ)
                  // =========================================================================
                  @SubscribeEvent
                  public static void onRenderGuiOverlay(RenderGuiOverlayEvent.Post event) {
                      if (event.getOverlay() != VanillaGuiOverlay.HOTBAR.type()) return;
                      Minecraft mc = Minecraft.getInstance();
                      if (mc.player == null || mc.options.hideGui) return;

                      GuiGraphics gui = event.getGuiGraphics();
                      PoseStack pose = gui.pose();
                      float time = mc.player.tickCount + event.getPartialTick();

                      pose.pushPose();
                      // Позиция тактического куклы-индикатора как в Escape from Tarkov (левый верхний угол)
                      pose.translate(12.0f, 12.0f, 0.0f);
                      // Легкий 3D-наклон карточки для объема
                      pose.mulPose(Axis.YP.rotationDegrees(8.0f));
                      pose.mulPose(Axis.ZP.rotationDegrees(-1.5f));

                      // Полупрозрачная темная тактическая подложка с тонкой рамкой
                      gui.fill(0, 0, 64, 96, 0x950B0E11);
                      gui.renderOutline(0, 0, 64, 96, isGusting ? 0xFFD93838 : 0x803A444C);

                      // 1. ГОЛОВА (Head)
                      drawTarkovBodyPart(gui, 26, 6, 12, 12, headHealth, false, false, time);

                      // 2. ГРУДНАЯ КЛЕТКА (Thorax)
                      drawTarkovBodyPart(gui, 22, 20, 20, 17, thoraxHealth, false, false, time);

                      // 3. ЖИВОТ (Stomach)
                      drawTarkovBodyPart(gui, 23, 39, 18, 13, stomachHealth, false, false, time);

                      // 4. ЛЕВАЯ РУКА ЭКРАНА -> ПРАВАЯ РУКА ПЕРСОНАЖА (LIMBS[1])
                      Limb rHand = LIMBS[1];
                      drawTarkovBodyPart(gui, 9, 20, 11, 30, rHand.health, rHand.bleeding, rHand.fractured || rHand.dislocated, time);
                      if (rHand.locked && climbingActive) gui.fill(12, 17, 17, 19, 0xFF38E8FF); // Индикатор фиксации хвата

                      // 5. ПРАВАЯ РУКА ЭКРАНА -> ЛЕВАЯ РУКА ПЕРСОНАЖА (LIMBS[0])
                      Limb lHand = LIMBS[0];
                      drawTarkovBodyPart(gui, 44, 20, 11, 30, lHand.health, lHand.bleeding, lHand.fractured || lHand.dislocated, time);
                      if (lHand.locked && climbingActive) gui.fill(47, 17, 52, 19, 0xFF38E8FF);

                      // 6. ЛЕВАЯ НОГА ЭКРАНА -> ПРАВАЯ НОГА ПЕРСОНАЖА (LIMBS[3])
                      Limb rFoot = LIMBS[3];
                      drawTarkovBodyPart(gui, 21, 54, 10, 31, rFoot.health, rFoot.bleeding, rFoot.fractured || rFoot.dislocated, time);
                      if (rFoot.locked && climbingActive) gui.fill(23, 86, 29, 88, 0xFF38E8FF);

                      // 7. ПРАВАЯ НОГА ЭКРАНА -> ЛЕВАЯ НОГА ПЕРСОНАЖА (LIMBS[2])
                      Limb lFoot = LIMBS[2];
                      drawTarkovBodyPart(gui, 33, 54, 10, 31, lFoot.health, lFoot.bleeding, lFoot.fractured || lFoot.dislocated, time);
                      if (lFoot.locked && climbingActive) gui.fill(35, 86, 41, 88, 0xFF38E8FF);

                      // Нижние безтекстовые графические полоски: Стамина (бирюзовая) и Магнезия (белая)
                      gui.fill(6, 90, 58, 92, 0xFF1A1E24);
                      int stamW = (int) (52.0f * (stamina / 100.0f));
                      int stamCol = stamina < 25.0f ? 0xFFE63946 : 0xFF38B6FF;
                      gui.fill(6, 90, 6 + stamW, 92, stamCol);

                      gui.fill(6, 93, 58, 94, 0xFF1A1E24);
                      int chalkW = (int) (52.0f * (chalkLevel / 100.0f));
                      gui.fill(6, 93, 6 + chalkW, 94, 0xFFEAEAEA);

                      pose.popPose();
                  }

                  // Отрисовка отдельного анатомического сегмента куклы в стиле Escape from Tarkov
                  private static void drawTarkovBodyPart(GuiGraphics gui, int x, int y, int w, int h,
                                                         float health, boolean bleeding, boolean fractured, float time) {
                      int fillColor;
                      int borderColor;

                      if (fractured && health < 20.0f) {
                          // Выбитая в 0 ("черная") конечность с багровой рамкой как в Таркове
                          fillColor = 0xE0080808;
                          borderColor = 0xFFB81D1D;
                      } else {
                          float ratio = Mth.clamp(health / 100.0f, 0.0f, 1.0f);
                          // Плавный градиент от тарковского зеленого -> желтого -> оранжевого -> красного
                          int r = (int) (ratio < 0.5f ? 225 : Mth.lerp((ratio - 0.5f) * 2.0f, 230, 55));
                          int g = (int) (ratio > 0.5f ? 195 : Mth.lerp(ratio * 2.0f, 35, 195));
                          int b = 45;
                          fillColor = (0xB8 << 24) | (r << 16) | (g << 8) | b;
                          borderColor = (0xFF << 24) | (Math.min(255, r + 30) << 16) | (Math.min(255, g + 30) << 8) | (b + 20);
                      }

                      // Если открыто кровотечение — сегмент тревожно пульсирует красным
                      if (bleeding && ((int)(time * 0.25f) % 2 == 0)) {
                          borderColor = 0xFFFF1E1E;
                      }

                      gui.fill(x, y, x + w, y + h, fillColor);
                      gui.renderOutline(x, y, w, h, borderColor);

                      int cx = x + w / 2;
                      int cy = y + h / 2;

                      // Графическая иконка кровотечения (красная капля без текста)
                      if (bleeding) {
                          gui.fill(cx - 1, cy - 4, cx + 1, cy - 2, 0xFFFF1111);
                          gui.fill(cx - 2, cy - 2, cx + 2, cy + 2, 0xFFFF1111);
                          gui.fill(cx - 1, cy + 2, cx + 1, cy + 3, 0xFFAA0000);
                      }

                      // Графическая иконка перелома/вывиха (белая зигзагообразная трещина кости)
                      if (fractured) {
                          gui.fill(cx - 3, cy - 3, cx, cy - 1, 0xFFFFFFFF);
                          gui.fill(cx - 1, cy - 1, cx + 2, cy + 1, 0xFFDADADA);
                          gui.fill(cx, cy + 1, cx + 3, cy + 3, 0xFFFFFFFF);
                      }
                  }

                  // =========================================================================
                  // ОБНОВЛЕНИЕ МЕДИЦИНЫ И УРОНА КОНЕЧНОСТЯМ
                  // =========================================================================
                  private static void updateMedicalAndInjuries(Player player) {
                      double vy = player.getDeltaMovement().y;

                      if (player.onGround() && !climbingActive && !mantlingActive) {
                          if (prevFallSpeed < -0.68) {
                              double impact = Math.abs(prevFallSpeed);
                              inflictFallImpactInjuries(player, impact);
                          }
                          if (!PLACED_PITONS.isEmpty()) {
                              PLACED_PITONS.clear();
                              hangingOnRope = false;
                          }
                      }

                      if (!climbingActive && !mantlingActive && player.horizontalCollision && player.getDeltaMovement().horizontalDistance() > 0.38) {
                          Limb randomSideLimb = LIMBS[player.level().random.nextInt(4)];
                          randomSideLimb.health = Math.max(15.0f, randomSideLimb.health - 28.0f);
                          randomSideLimb.bleeding = true;
                          if (randomSideLimb.health < 25.0f) randomSideLimb.fractured = true;
                          thoraxHealth = Math.max(30.0f, thoraxHealth - 15.0f);
                          spawnBloodParticles(player, randomSideLimb.currentPos.equals(Vec3.ZERO) ? player.position().add(0, 1, 0) : randomSideLimb.currentPos, 12);
                          player.playSound(SoundEvents.PLAYER_HURT, 0.9f, 0.8f);
                      }

                      prevFallSpeed = vy;

                      int bleedingCount = 0;
                      for (Limb limb : LIMBS) {
                          if (limb.bleeding) {
                              bleedingCount++;
                              limb.health = Math.max(5.0f, limb.health - 0.035f);
                              if (player.tickCount % 8 == 0) {
                                  Vec3 bleedPos = climbingActive ? limb.currentPos : getJointRoot(player, limb, 1.0f);
                                  spawnBloodParticles(player, bleedPos, 3);
                              }
                          } else if (limb.health < 100.0f && !limb.fractured && !limb.dislocated) {
                              limb.health = Math.min(100.0f, limb.health + 0.015f);
                          }
                      }

                      if (bleedingCount > 0) {
                          bloodLoss = Math.min(100.0f, bloodLoss + bleedingCount * 0.045f);
                          thoraxHealth = Math.max(20.0f, thoraxHealth - bleedingCount * 0.01f);
                          if (player.tickCount % 80 == 0) {
                              player.hurt(player.damageSources().generic(), 1.0f);
                          }
                      } else {
                          bloodLoss = Math.max(0.0f, bloodLoss - 0.06f);
                          thoraxHealth = Math.min(100.0f, thoraxHealth + 0.02f);
                          headHealth = Math.min(100.0f, headHealth + 0.02f);
                          stomachHealth = Math.min(100.0f, stomachHealth + 0.02f);
                      }

                      if (player.onGround() && !climbingActive && !mantlingActive) {
                          float legPenalty = 1.0f;
                          if (LIMBS[2].fractured || LIMBS[2].dislocated) legPenalty -= 0.35f;
                          if (LIMBS[3].fractured || LIMBS[3].dislocated) legPenalty -= 0.35f;
                          if (legPenalty < 1.0f) {
                              Vec3 m = player.getDeltaMovement();
                              player.setDeltaMovement(m.x * legPenalty, m.y, m.z * legPenalty);
                          }
                      }

                      if (bloodLoss > 60.0f && player.tickCount % 60 == 0) {
                          player.addEffect(new MobEffectInstance(MobEffects.CONFUSION, 100, 0, false, false));
                      }
                  }

                  private static void inflictLimbRipInjury(Player player, Limb limb) {
                      limb.health = Math.max(12.0f, limb.health - 22.0f);
                      limb.bleeding = true;
                      if (limb.health <= 20.0f) limb.fractured = true;
                      spawnBloodParticles(player, limb.currentPos, 10);
                      player.playSound(SoundEvents.PLAYER_HURT, 0.8f, 1.1f);
                  }

                  private static void inflictSkinAbrasion(Player player, Limb limb) {
                      limb.health = Math.max(20.0f, limb.health - 15.0f);
                      limb.bleeding = true;
                      spawnBloodParticles(player, limb.currentPos, 8);
                      player.playSound(SoundEvents.PLAYER_HURT, 0.65f, 1.25f);
                  }

                  private static void inflictFallImpactInjuries(Player player, double impactSpeed) {
                      float dmg = (float) ((impactSpeed - 0.62) * 90.0);
                      if (dmg <= 8.0f) return;

                      LIMBS[2].health = Math.max(0.0f, LIMBS[2].health - dmg);
                      LIMBS[3].health = Math.max(0.0f, LIMBS[3].health - dmg * 0.9f);
                      stomachHealth = Math.max(25.0f, stomachHealth - dmg * 0.4f);

                      if (LIMBS[2].health < 25.0f) {
                          LIMBS[2].fractured = true;
                          LIMBS[2].bleeding = true;
                      } else if (LIMBS[2].health < 55.0f) {
                          LIMBS[2].dislocated = true;
                      }

                      if (LIMBS[3].health < 25.0f) {
                          LIMBS[3].fractured = true;
                          LIMBS[3].bleeding = true;
                      } else if (LIMBS[3].health < 55.0f) {
                          LIMBS[3].dislocated = true;
                      }

                      spawnBloodParticles(player, player.position().add(0, 0.3, 0), 18);
                      player.playSound(SoundEvents.SKELETON_HURT, 1.0f, 0.55f);
                      player.playSound(SoundEvents.PLAYER_BIG_FALL, 1.0f, 0.8f);
                  }

                  private static void spawnBloodParticles(Player player, Vec3 pos, int count) {
                      BlockParticleOption bloodParticle = new BlockParticleOption(ParticleTypes.BLOCK, Blocks.REDSTONE_BLOCK.defaultBlockState());
                      for (int i = 0; i < count; i++) {
                          player.level().addParticle(
                                  bloodParticle,
                                  pos.x + (player.level().random.nextDouble() - 0.5) * 0.25,
                                  pos.y + (player.level().random.nextDouble() - 0.5) * 0.25,
                                  pos.z + (player.level().random.nextDouble() - 0.5) * 0.25,
                                  0.0, -0.08, 0.0
                          );
                      }
                  }

                  private static void updateRopeArrestPhysics(Player player) {
                      if (PLACED_PITONS.isEmpty()) return;

                      Vec3 lastAnchor = PLACED_PITONS.get(PLACED_PITONS.size() - 1);
                      Vec3 waistPos = player.position().add(0, 0.85, 0);
                      double dist = waistPos.distanceTo(lastAnchor);

                      if (dist > maxRopeSlack) {
                          if (!hangingOnRope) {
                              hangingOnRope = true;
                              fallFlailTicks = 0;
                              player.playSound(SoundEvents.LEASH_KNOT_PLACE, 1.0f, 0.8f);

                              if (player.getDeltaMovement().y < -0.95) {
                                  LIMBS[2].dislocated = true;
                                  LIMBS[2].health = Math.max(30.0f, LIMBS[2].health - 20.0f);
                                  stomachHealth = Math.max(40.0f, stomachHealth - 20.0f);
                                  player.playSound(SoundEvents.PLAYER_HURT, 0.8f, 0.9f);
                              }
                          }

                          Vec3 pullDir = lastAnchor.subtract(waistPos).normalize();
                          double stretch = dist - maxRopeSlack;
                          Vec3 currentVel = player.getDeltaMovement();

                          double climbRopeBoost = Minecraft.getInstance().options.keyJump.isDown() ? 0.14 : 0.0;

                          Vec3 springForce = pullDir.scale(Math.min(stretch * 0.38, 0.75));
                          Vec3 dampedVel = currentVel.scale(0.65).add(springForce).add(0, climbRopeBoost, 0);

                          player.setDeltaMovement(dampedVel);
                          player.fallDistance = 0.0f;
                      } else {
                          hangingOnRope = false;
                      }
                  }

                  private static void updateAtmosphereAndWind(Player player) {
                      Level level = player.level();
                      double y = player.getY();

                      double altAboveSea = Math.max(0.0, y - 64.0);
                      pressureKPa = (float) Mth.clamp(101.3 * Math.exp(-altAboveSea / 260.0), 38.0, 101.3);
                      hypoxiaFactor = (float) Mth.clamp((y - 85.0) / 190.0, 0.0, 1.0);
                      if (hypoxiaFactor > 0.7f) headHealth = Math.max(45.0f, headHealth - 0.01f);

                      BlockPos eyePos = BlockPos.containing(player.getEyePosition());
                      int skyLight = level.getBrightness(LightLayer.SKY, eyePos);
                      float exposure = skyLight / 15.0f;

                      if (exposure <= 0.1f) {
                          windSpeed = Mth.lerp(0.05f, windSpeed, 0.5f);
                          currentWind = Vec3.ZERO;
                          isGusting = false;
                          return;
                      }

                      float weatherMult = level.isThundering() ? 2.1f : (level.isRaining() ? 1.45f : 1.0f);

                      if (gustTimer > 0) {
                          gustTimer--;
                          isGusting = true;
                      } else {
                          isGusting = false;
                          float gustChance = (0.003f + hypoxiaFactor * 0.012f) * weatherMult;
                          if (level.random.nextFloat() < gustChance) {
                              gustTimer = 60 + level.random.nextInt(50);
                              isGusting = true;
                          }
                      }

                      float baseWind = (2.5f + (float)(altAboveSea * 0.085f)) * exposure * weatherMult;
                      float targetWindSpeed = isGusting ? baseWind * 2.15f + 5.5f : baseWind;
                      windSpeed = Mth.lerp(0.04f, windSpeed, Mth.clamp(targetWindSpeed, 0.0f, 32.0f));

                      double angle = (level.getGameTime() * 0.007) + Math.sin(level.getGameTime() * 0.03) * 0.8;
                      double wx = Math.cos(angle);
                      double wz = Math.sin(angle);
                      double wy = Math.sin(level.getGameTime() * 0.05) * 0.25;

                      double forceScale = (windSpeed / 25.0) * 0.35;
                      currentWind = new Vec3(wx * forceScale, wy * forceScale, wz * forceScale);
                  }

                  private static void handleLimbInput(Player player, int index, KeyMapping key) {
                      Limb limb = LIMBS[index];
                      if (key.isDown()) {
                          if (limb.fractured || limb.health < 20.0f) return;

                          limb.reaching = true;
                          Vec3 eye = player.getEyePosition();
                          double maxReachRay = (2.1 - (hypoxiaFactor * 0.35)) * (0.6 + 0.4 * limb.getEffectiveness());
                          Vec3 reach = eye.add(player.getLookAngle().scale(maxReachRay));
                          BlockHitResult hit = player.level().clip(new ClipContext(eye, reach, ClipContext.Block.OUTLINE, ClipContext.Fluid.NONE, player));

                          if (hit.getType() == HitResult.Type.BLOCK && hit.getDirection() != Direction.DOWN) {
                              Vec3 gripPoint = hit.getLocation();
                              Vec3 root = getJointRoot(player, limb, 1.0f);
                              double allowedDist = (1.55 - (hypoxiaFactor * 0.2)) * (0.65 + 0.35 * limb.getEffectiveness());
                              if (root.distanceTo(gripPoint) <= allowedDist && limb.targetPos.distanceTo(gripPoint) > 0.06) {
                                  limb.startPos = limb.currentPos;
                                  limb.targetPos = gripPoint;
                                  limb.moveProgress = 0.0f;
                                  BlockState state = player.level().getBlockState(hit.getBlockPos());
                                  limb.gripQuality = state.getBlock().getFriction();
                                  limb.locked = true;
                              }
                          }
                      } else {
                          limb.reaching = false;
                      }
                  }

                  private static boolean tryEngageWall(Player player) {
                      if (LIMBS[0].fractured && LIMBS[1].fractured) return false;

                      Vec3 eye = player.getEyePosition();
                      Vec3 forward = Vec3.directionFromRotation(0, player.getYRot());
                      BlockHitResult hit = player.level().clip(new ClipContext(eye, eye.add(forward.scale(1.4)), ClipContext.Block.OUTLINE, ClipContext.Fluid.NONE, player));

                      if (hit.getType() != HitResult.Type.BLOCK) return false;

                      Direction face = hit.getDirection();
                      if (face.getAxis().isHorizontal()) {
                          lockedWallYaw = face.getOpposite().toYRot();
                      } else {
                          lockedWallYaw = player.getYRot();
                      }

                      Vec3 wallHit = hit.getLocation();
                      Vec3 wallForward = Vec3.directionFromRotation(0, lockedWallYaw);
                      Vec3 right = wallForward.cross(new Vec3(0, 1, 0)).normalize();

                      LIMBS[0].prevPos = LIMBS[0].startPos = LIMBS[0].targetPos = LIMBS[0].currentPos = wallHit.add(right.scale(-0.35)).add(0, 0.25, 0);
                      LIMBS[1].prevPos = LIMBS[1].startPos = LIMBS[1].targetPos = LIMBS[1].currentPos = wallHit.add(right.scale(0.35)).add(0, 0.25, 0);
                      LIMBS[2].prevPos = LIMBS[2].startPos = LIMBS[2].targetPos = LIMBS[2].currentPos = wallHit.add(right.scale(-0.25)).add(0, -0.75, 0);
                      LIMBS[3].prevPos = LIMBS[3].startPos = LIMBS[3].targetPos = LIMBS[3].currentPos = wallHit.add(right.scale(0.25)).add(0, -0.75, 0);

                      for (Limb limb : LIMBS) {
                          limb.locked = !limb.fractured && limb.health >= 20.0f;
                          limb.moveProgress = 1.0f;
                      }
                      return true;
                  }

                  private static void disengageClimb(Player player, boolean isFall) {
                      climbingActive = false;
                      if (isFall) {
                          fallFlailTicks = 45;
                          player.playSound(SoundEvents.PLAYER_ATTACK_SWEEP, 0.8f, 0.6f);
                      }
                      for (Limb limb : LIMBS) limb.locked = false;
                  }

                  private static Vec3 getJointRoot(Player player, Limb limb, float partialTick) {
                      Vec3 forward = Vec3.directionFromRotation(0, (climbingActive || mantlingActive) ? lockedWallYaw : player.getViewYRot(partialTick));
                      Vec3 right = forward.cross(new Vec3(0, 1, 0)).normalize();
                      double sideOffset = limb.isLeft ? -0.28 : 0.28;
                      double heightOffset = limb.isHand ? 1.32 : 0.72;
                      return player.getPosition(partialTick).add(right.scale(sideOffset)).add(0, heightOffset, 0);
                  }

                  private static Vec3 solveTwoBoneIK(Vec3 root, Vec3 target, boolean isHand, boolean isLeft) {
                      double boneLen = isHand ? 0.42 : 0.46;
                      Vec3 diff = target.subtract(root);
                      double dist = Mth.clamp(diff.length(), 0.1, boneLen * 1.98);
                      Vec3 midPoint = root.add(diff.scale(0.5));

                      double bendAmount = Math.sqrt(Math.max(0.0, boneLen * boneLen - (dist * 0.5) * (dist * 0.5)));
                      Vec3 wallForward = Vec3.directionFromRotation(0, lockedWallYaw);
                      Vec3 right = wallForward.cross(new Vec3(0, 1, 0)).normalize();

                      Vec3 bendDir = right.scale(isLeft ? -0.55 : 0.55)
                              .add(0, isHand ? -0.75 : 0.25, 0)
                              .subtract(wallForward.scale(0.45))
                              .normalize();
                      return midPoint.add(bendDir.scale(bendAmount));
                  }

                  // =========================================================================
                  // 1. РЕНДЕР РУК ОТ ПЕРВОГО ЛИЦА (ПРИВЯЗКА К 3D-МИРУ + ВЫХОД НА УСТУП MANTLE)
                  // =========================================================================
                  @SubscribeEvent
                  public static void onRenderHandFirstPerson(RenderHandEvent event) {
                      Minecraft mc = Minecraft.getInstance();
                      AbstractClientPlayer player = mc.player;
                      if (player == null) return;

                      if (!climbingActive && !mantlingActive && !hangingOnRope && fallFlailTicks <= 0 && bandageAnimTicks <= 0) return;

                      event.setCanceled(true);
                      if (event.getHand() != InteractionHand.MAIN_HAND) return;

                      PoseStack poseStack = event.getPoseStack();
                      MultiBufferSource buffer = event.getMultiBufferSource();
                      int light = event.getPackedLight();
                      float pt = event.getPartialTick();
                      float time = player.tickCount + pt;

                      PlayerRenderer playerRenderer = (PlayerRenderer) mc.getEntityRenderDispatcher().getRenderer(player);

                      renderWorldBoundFirstPersonArm(poseStack, buffer, light, player, playerRenderer, true, pt, time);
                      renderWorldBoundFirstPersonArm(poseStack, buffer, light, player, playerRenderer, false, pt, time);
                  }

                  private static void renderWorldBoundFirstPersonArm(PoseStack poseStack, MultiBufferSource buffer, int light,
                                                                     AbstractClientPlayer player, PlayerRenderer renderer,
                                                                     boolean isLeft, float pt, float time) {
                      float side = isLeft ? -1.0f : 1.0f;
                      Limb handLimb = isLeft ? LIMBS[0] : LIMBS[1];

                      if (bandageAnimTicks > 0 || chalkAnimTicks > 0 || (!climbingActive && !mantlingActive && (fallFlailTicks > 0 || hangingOnRope))) {
                          poseStack.pushPose();
                          double x = side * 0.35, y = -0.32, z = -0.50;
                          float pitch = -65.0f, yaw = side * 15.0f, roll = side * -12.0f;

                          if (bandageAnimTicks > 0) {
                              double wrapCircle = Math.sin(time * 1.4) * 0.12;
                              x = side * 0.14 + (isLeft ? 0.0 : wrapCircle);
                              y = -0.34 + (isLeft ? 0.0 : Math.cos(time * 1.4) * 0.10);
                              z = -0.46;
                              pitch = -45.0f;
                              yaw = side * -30.0f;
                          } else if (chalkAnimTicks > 0) {
                              x = side * (0.10 + Math.sin(time * 1.8) * 0.06);
                              y = -0.38 + Math.cos(time * 2.2) * 0.04;
                              z = -0.45;
                              pitch = -35.0f;
                              yaw = side * -35.0f;
                          } else if (fallFlailTicks > 0) {
                              y = -0.25 + Math.sin(time * 1.4 + side) * 0.22;
                              x = side * (0.42 + Math.cos(time * 1.1) * 0.12);
                              pitch = -95.0f + (float) Math.sin(time * 1.6 + side) * 35.0f;
                          } else if (hangingOnRope) {
                              double climbOffset = Minecraft.getInstance().options.keyJump.isDown() ? Math.sin(time * 0.9 + (isLeft ? 0 : Math.PI)) * 0.14 : 0.0;
                              x = side * 0.12;
                              y = -0.22 + climbOffset;
                              z = -0.42;
                              pitch = -80.0f;
                              yaw = side * -20.0f;
                          }

                          poseStack.translate(x, y, z);
                          poseStack.mulPose(Axis.XP.rotationDegrees(pitch));
                          poseStack.mulPose(Axis.YP.rotationDegrees(yaw));
                          poseStack.mulPose(Axis.ZP.rotationDegrees(roll));
                          if (isLeft) renderer.renderLeftHand(poseStack, buffer, light, player);
                          else renderer.renderRightHand(poseStack, buffer, light, player);
                          poseStack.popPose();
                          return;
                      }

                      // 3D-привязка рук к точкам опоры на скале или кромке уступа при выходе силой (Mantle)
                      Vec3 eyePos = player.getEyePosition(pt);
                      Vec3 shoulderWorld = getJointRoot(player, handLimb, pt);
                      Vec3 handWorld = mantlingActive ? (isLeft ? mantleLeftHandPos : mantleRightHandPos) : handLimb.getRenderPos(pt);

                      if (pitonAnimTicks > 0 && !isLeft && !lastPitonStrikePos.equals(Vec3.ZERO)) {
                          double strikeWave = Math.sin(pitonAnimTicks * 0.9);
                          handWorld = lastPitonStrikePos.add(player.getLookAngle().scale(-Math.max(0, strikeWave) * 0.25));
                      }

                      if (stamina < 40f || hypoxiaFactor > 0.4f || isGusting || handLimb.bleeding || handLimb.dislocated) {
                          double amp = (handLimb.bleeding || handLimb.dislocated) ? 0.022 : 0.010;
                          handWorld = handWorld.add(
                                  Math.sin(time * 2.3 + side) * amp,
                                  Math.cos(time * 2.7 + side) * amp,
                                  Math.sin(time * 1.9) * amp
                          );
                      }

                      Vec3 armOriginWorld = shoulderWorld.lerp(handWorld, 0.58);
                      Vec3 relToEye = armOriginWorld.subtract(eyePos);

                      Vec3 armDirWorld = handWorld.subtract(shoulderWorld);
                      if (armDirWorld.lengthSqr() < 0.001) armDirWorld = new Vec3(0, 1, 0);
                      armDirWorld = armDirWorld.normalize();

                      float armYawWorld = (float) (Mth.atan2(armDirWorld.x, armDirWorld.z) * (180.0 / Math.PI));
                      float armPitchWorld = (float) (Math.asin(Mth.clamp(armDirWorld.y, -1.0, 1.0)) * (180.0 / Math.PI));

                      float camYaw = player.getViewYRot(pt);
                      float camPitch = player.getViewXRot(pt);

                      poseStack.pushPose();
                      poseStack.mulPose(Axis.XP.rotationDegrees(camPitch));
                      poseStack.mulPose(Axis.YP.rotationDegrees(camYaw + 180.0f));
                      poseStack.translate(relToEye.x, relToEye.y, relToEye.z);
                      poseStack.mulPose(Axis.YP.rotationDegrees(-armYawWorld));
                      poseStack.mulPose(Axis.XP.rotationDegrees(armPitchWorld - 90.0f));

                      float twistRoll = handLimb.dislocated ? side * 32.0f : side * -10.0f;
                      poseStack.mulPose(Axis.ZP.rotationDegrees(twistRoll));
                      poseStack.scale(0.85f, 1.15f, 0.85f);

                      if (isLeft) renderer.renderLeftHand(poseStack, buffer, light, player);
                      else renderer.renderRightHand(poseStack, buffer, light, player);
                      poseStack.popPose();
                  }

                  // =========================================================================
                  // 2. АНИМАЦИЯ МОДЕЛИ ОТ 3-ГО ЛИЦА (ВКЛЮЧАЯ ВЫХОД СИЛОЙ НА УСТУП MANTLE)
                  // =========================================================================
                  @SubscribeEvent
                  public static void onRenderPlayerPost(RenderPlayerEvent.Post event) {
                      Player player = event.getEntity();
                      if (player != Minecraft.getInstance().player) return;
                      if (!climbingActive && !mantlingActive && !hangingOnRope && fallFlailTicks <= 0 && chalkAnimTicks <= 0 && pitonAnimTicks <= 0 && bandageAnimTicks <= 0) return;
                      player.walkAnimation.setSpeed(0.0f);
                  }

                  @SubscribeEvent
                  public static void onRenderPlayerPre(RenderPlayerEvent.Pre event) {
                      Player player = event.getEntity();
                      if (player != Minecraft.getInstance().player) return;

                      PlayerModel<AbstractClientPlayer> model = event.getRenderer().getModel();
                      float pt = event.getPartialTick();
                      float time = player.tickCount + pt;

                      // Анимация выхода силой на горизонтальный уступ (Ledge Mantle)
                      if (mantlingActive) {
                          player.walkAnimation.setSpeed(0.0f);
                          player.yBodyRot = lockedWallYaw;
                          player.yBodyRotO = lockedWallYaw;
                          float progress = (mantleTicks + pt) / MAX_MANTLE_TICKS;

                          // Корпус сильно наклоняется вперед над уступом, руки отжимаются вниз от кромки камня
                          model.body.xRot = (float) Math.sin(progress * Math.PI) * 0.65f;
                          model.leftArm.xRot = -1.8f + progress * 1.9f;
                          model.leftArm.zRot = -0.25f;
                          model.rightArm.xRot = -1.8f + progress * 1.9f;
                          model.rightArm.zRot = 0.25f;

                          // Ноги подтягиваются коленями к груди для постановки стоп на крышу
                          model.leftLeg.xRot = -1.1f * (float) Math.sin(progress * Math.PI);
                          model.rightLeg.xRot = -0.8f * (float) Math.sin(progress * Math.PI);
                          syncModelLayers(model);
                          return;
                      }

                      if (bandageAnimTicks > 0 && !climbingActive) {
                          model.body.xRot = 0.25f;
                          model.leftArm.xRot = -1.1f;
                          model.leftArm.yRot = 0.45f;
                          model.rightArm.xRot = -1.1f + Mth.sin(time * 1.5f) * 0.35f;
                          model.rightArm.yRot = -0.55f + Mth.cos(time * 1.5f) * 0.25f;
                          syncModelLayers(model);
                          return;
                      }

                      if (!climbingActive && !hangingOnRope && fallFlailTicks <= 0) {
                          if (LIMBS[0].fractured) {
                              model.leftArm.xRot = 0.15f;
                              model.leftArm.zRot = -0.28f;
                          }
                          if (LIMBS[1].fractured) {
                              model.rightArm.xRot = 0.15f;
                              model.rightArm.zRot = 0.28f;
                          }
                          if (LIMBS[2].fractured || LIMBS[3].fractured) {
                              model.body.zRot = Mth.sin(time * 0.3f) * 0.15f;
                          }
                          syncModelLayers(model);
                          return;
                      }

                      player.walkAnimation.setSpeed(0.0f);

                      if (fallFlailTicks > 0 && !climbingActive && !hangingOnRope) {
                          model.body.xRot = 0.35f;
                          model.leftArm.xRot = -2.4f + Mth.sin(time * 1.5f) * 0.75f;
                          model.leftArm.zRot = -0.6f + Mth.cos(time * 1.2f) * 0.35f;
                          model.rightArm.xRot = -2.4f - Mth.sin(time * 1.5f) * 0.75f;
                          model.rightArm.zRot = 0.6f - Mth.cos(time * 1.2f) * 0.35f;

                          model.leftLeg.xRot = Mth.sin(time * 1.4f) * 0.65f;
                          model.rightLeg.xRot = -Mth.sin(time * 1.4f) * 0.65f;
                          syncModelLayers(model);
                          return;
                      }

                      if (hangingOnRope && !climbingActive) {
                          boolean pulling = Minecraft.getInstance().options.keyJump.isDown();
                          float pullCycle = pulling ? Mth.sin(time * 0.7f) * 0.45f : 0.0f;

                          model.body.xRot = 0.18f;
                          model.body.zRot = Mth.sin(time * 0.15f) * 0.08f;

                          model.leftArm.xRot = -2.35f + pullCycle;
                          model.leftArm.yRot = 0.35f;
                          model.rightArm.xRot = -2.35f - pullCycle;
                          model.rightArm.yRot = -0.35f;

                          model.leftLeg.xRot = -0.35f + pullCycle * 0.3f;
                          model.leftLeg.zRot = -0.12f;
                          model.rightLeg.xRot = -0.25f - pullCycle * 0.3f;
                          model.rightLeg.zRot = 0.12f;
                          syncModelLayers(model);
                          return;
                      }

                      if (climbingActive) {
                          player.yBodyRot = lockedWallYaw;
                          player.yBodyRotO = lockedWallYaw;

                          float breathFreq = 0.18f + (1.0f - stamina / 100.0f) * 0.35f + hypoxiaFactor * 0.25f;
                          float breathAmp = 0.04f + (1.0f - stamina / 100.0f) * 0.06f;
                          float leanSide = -player.xxa * 0.22f + (float)(currentWind.x * 0.25f);
                          float pullForward = (pullUpAnimTicks > 0) ? Mth.sin(pullUpAnimTicks * 0.3f) * 0.22f : 0.08f;

                          model.body.xRot = pullForward + Mth.sin(time * breathFreq) * breathAmp;
                          model.body.zRot = leanSide;
                          model.body.yRot = (LIMBS[0].reaching ? -0.18f : (LIMBS[1].reaching ? 0.18f : 0.0f));

                          applyLimbIKToModel(player, LIMBS[0], model.leftArm, pt, time);
                          applyLimbIKToModel(player, LIMBS[1], model.rightArm, pt, time);
                          applyLimbIKToModel(player, LIMBS[2], model.leftLeg, pt, time);
                          applyLimbIKToModel(player, LIMBS[3], model.rightLeg, pt, time);

                          if (bandageAnimTicks > 0) {
                              model.leftArm.xRot = -1.05f;
                              model.leftArm.yRot = 0.55f;
                              model.rightArm.xRot = -1.05f + Mth.sin(time * 1.6f) * 0.35f;
                              model.rightArm.yRot = -0.55f + Mth.cos(time * 1.6f) * 0.25f;
                          } else if (chalkAnimTicks > 0) {
                              model.leftArm.xRot = -0.85f + Mth.sin(time * 1.8f) * 0.25f;
                              model.leftArm.yRot = 0.65f;
                              model.leftArm.zRot = 0.25f;

                              model.rightArm.xRot = -0.85f - Mth.sin(time * 1.8f) * 0.25f;
                              model.rightArm.yRot = -0.65f;
                              model.rightArm.zRot = -0.25f;
                          } else if (pitonAnimTicks > 0) {
                              float hammerSwing = Mth.sin(pitonAnimTicks * 0.9f);
                              model.rightArm.xRot = -1.9f + hammerSwing * 0.95f;
                              model.rightArm.yRot = -0.15f;
                              model.rightArm.zRot = 0.1f;
                          }

                          syncModelLayers(model);
                      }
                  }

                  private static void applyLimbIKToModel(Player player, Limb limb, ModelPart part, float pt, float time) {
                      if (limb.fractured) {
                          part.xRot = 0.08f + Mth.sin(time * 0.2f) * 0.05f;
                          part.zRot = limb.isLeft ? -0.22f : 0.22f;
                          part.yRot = limb.isLeft ? 0.35f : -0.35f;
                          return;
                      }

                      if (!limb.locked) {
                          float balanceWave = Mth.sin(time * 0.45f + (limb.isLeft ? 0.0f : 2.0f));
                          if (limb.isHand) {
                              part.xRot = -1.3f + balanceWave * 0.35f;
                              part.zRot = (limb.isLeft ? -0.75f : 0.75f) + balanceWave * 0.25f;
                              part.yRot = 0.0f;
                          } else {
                              part.xRot = 0.25f + balanceWave * 0.2f;
                              part.zRot = (limb.isLeft ? -0.25f : 0.25f);
                              part.yRot = 0.0f;
                          }
                          return;
                      }

                      Vec3 root = getJointRoot(player, limb, pt);
                      Vec3 targetDir = limb.elbowOrKneePos.lerp(limb.getRenderPos(pt), 0.65).subtract(root).normalize();

                      Vec3 wallForward = Vec3.directionFromRotation(0, lockedWallYaw);
                      Vec3 wallRight = wallForward.cross(new Vec3(0, 1, 0)).normalize();

                      double localForward = targetDir.dot(wallForward);
                      double localUp = targetDir.y;
                      double localSide = targetDir.dot(wallRight);

                      float painTremor = (stamina < 35f || hypoxiaFactor > 0.45f || limb.bleeding || limb.dislocated)
                              ? Mth.sin(time * 2.2f + (limb.isLeft ? 0 : 1.5f)) * 0.06f : 0.0f;

                      float dislocationTwist = limb.dislocated ? (limb.isLeft ? -0.35f : 0.35f) : 0.0f;

                      if (limb.isHand) {
                          part.xRot = (float) (-Math.atan2(localForward, -localUp)) + painTremor;
                          part.zRot = (float) (localSide * 1.15) + (limb.isLeft ? -0.18f : 0.18f) + dislocationTwist;
                          part.yRot = (float) (-localSide * 0.45);
                      } else {
                          double legLift = Mth.clamp((limb.getRenderPos(pt).y - player.getY()) * 1.4, -0.4, 1.3);
                          part.xRot = (float) (-legLift * 1.15 - Math.max(0, localForward * 0.5)) + painTremor;
                          part.zRot = (float) (localSide * 0.85) + (limb.isLeft ? -0.15f : 0.15f) + dislocationTwist;
                          part.yRot = (float) (limb.isLeft ? -0.2f : 0.2f);
                      }
                  }

                  private static void syncModelLayers(PlayerModel<AbstractClientPlayer> model) {
                      model.jacket.copyFrom(model.body);
                      model.leftSleeve.copyFrom(model.leftArm);
                      model.rightSleeve.copyFrom(model.rightArm);
                      model.leftPants.copyFrom(model.leftLeg);
                      model.rightPants.copyFrom(model.rightLeg);
                  }

                  // =========================================================================
                  // 3. 3D-ВИЗУАЛИЗАЦИЯ СУСТАВОВ И ЗАЦЕПОВ В МИРЕ
                  // =========================================================================
                  @SubscribeEvent
                  public static void onRenderWorld(RenderLevelStageEvent event) {
                      if (event.getStage() != RenderLevelStageEvent.Stage.AFTER_PARTICLES) return;
                      if (!climbingActive && !mantlingActive && PLACED_PITONS.isEmpty()) return;

                      Minecraft mc = Minecraft.getInstance();
                      Player player = mc.player;
                      if (player == null) return;

                      float pt = event.getPartialTick();
                      Vec3 cam = event.getCamera().getPosition();
                      PoseStack poseStack = event.getPoseStack();
                      MultiBufferSource.BufferSource buffer = mc.renderBuffers().bufferSource();
                      VertexConsumer builder = buffer.getBuffer(RenderType.lines());

                      poseStack.pushPose();
                      poseStack.translate(-cam.x, -cam.y, -cam.z);

                      if (!PLACED_PITONS.isEmpty()) {
                          for (int i = 0; i < PLACED_PITONS.size(); i++) {
                              Vec3 piton = PLACED_PITONS.get(i);
                              AABB pitonBox = new AABB(piton, piton).inflate(0.06);
                              LevelRenderer.renderLineBox(poseStack, builder, pitonBox.minX, pitonBox.minY, pitonBox.minZ, pitonBox.maxX, pitonBox.maxY, pitonBox.maxZ, 0.9f, 0.5f, 0.1f, 1.0f);

                              if (i > 0) {
                                  drawRopeSegments(poseStack, builder, PLACED_PITONS.get(i - 1), piton, false);
                              }
                          }
                          Vec3 lastPiton = PLACED_PITONS.get(PLACED_PITONS.size() - 1);
                          Vec3 playerWaist = player.getPosition(pt).add(0, 0.85, 0);
                          drawRopeSegments(poseStack, builder, lastPiton, playerWaist, hangingOnRope);
                      }

                      if (climbingActive || mantlingActive) {
                          for (Limb limb : LIMBS) {
                              if (mantlingActive && !limb.isHand) continue;
                              Vec3 root = getJointRoot(player, limb, pt);
                              Vec3 end = mantlingActive ? (limb.isLeft ? mantleLeftHandPos : mantleRightHandPos) : limb.getRenderPos(pt);
                              Vec3 joint = solveTwoBoneIK(root, end, limb.isHand, limb.isLeft);

                              float r = (limb.fractured || limb.bleeding) ? 1.0f : (limb.dislocated ? 1.0f : 0.15f);
                              float g = (limb.fractured || limb.bleeding) ? 0.1f : (limb.dislocated ? 0.65f : (limb.locked ? 0.95f : 0.35f));
                              float b = (limb.fractured || limb.bleeding || limb.dislocated) ? 0.1f : (limb.isHand ? 0.95f : 0.35f);

                              AABB grip = new AABB(end, end).inflate(0.075);
                              LevelRenderer.renderLineBox(poseStack, builder, grip.minX, grip.minY, grip.minZ, grip.maxX, grip.maxY, grip.maxZ, r, g, b, 1.0f);

                              AABB elbow = new AABB(joint, joint).inflate(0.05);
                              LevelRenderer.renderLineBox(poseStack, builder, elbow.minX, elbow.minY, elbow.minZ, elbow.maxX, elbow.maxY, elbow.maxZ, r, g, 0.1f, 0.9f);

                              drawBoneSegment(poseStack, builder, root, joint, r, g, b);
                              drawBoneSegment(poseStack, builder, joint, end, r, g, b);
                          }
                      }

                      poseStack.popPose();
                      buffer.endBatch(RenderType.lines());
                  }

                  private static void drawBoneSegment(PoseStack poseStack, VertexConsumer builder, Vec3 a, Vec3 b, float r, float g, float bl) {
                      Matrix4f mat = poseStack.last().pose();
                      Vec3 norm = b.subtract(a).normalize();
                      builder.vertex(mat, (float) a.x, (float) a.y, (float) a.z).color(r, g, bl, 1.0f).normal((float) norm.x, (float) norm.y, (float) norm.z).endVertex();
                      builder.vertex(mat, (float) b.x, (float) b.y, (float) b.z).color(r, g, bl, 1.0f).normal((float) norm.x, (float) norm.y, (float) norm.z).endVertex();
                  }

                  private static void drawRopeSegments(PoseStack poseStack, VertexConsumer builder, Vec3 from, Vec3 to, boolean taut) {
                      Matrix4f mat = poseStack.last().pose();
                      int steps = 14;
                      Vec3 prev = from;
                      for (int s = 1; s <= steps; s++) {
                          double t = (double) s / steps;
                          Vec3 pt = from.lerp(to, t);
                          if (!taut) {
                              double sag = Math.sin(t * Math.PI) * 0.28;
                              pt = pt.add(0, -sag, 0);
                          }
                          float r = taut ? 1.0f : 0.85f;
                          float g = taut ? 0.2f : 0.75f;
                          float b = 0.2f;
                          Vec3 dir = pt.subtract(prev).normalize();
                          builder.vertex(mat, (float) prev.x, (float) prev.y, (float) prev.z).color(r, g, b, 1.0f).normal((float) dir.x, (float) dir.y, (float) dir.z).endVertex();
                          builder.vertex(mat, (float) pt.x, (float) pt.y, (float) pt.z).color(r, g, b, 1.0f).normal((float) dir.x, (float) dir.y, (float) dir.z).endVertex();
                          prev = pt;
                      }
                  }
              }
          }
          EOF

          gradle build --no-daemon --stacktrace

