                  @SubscribeEvent
                  public static void onRenderInventoryScreen(ScreenEvent.Render.Post event) {
                      if (event.getScreen() instanceof InventoryScreen invScreen) {
                          Minecraft mc = Minecraft.getInstance();
                          if (mc.player == null) return;
                          float time = mc.player.tickCount + event.getPartialTick();

                          // Располагаем панель био-сканера слева от классического окна инвентаря
                          int guiLeft = invScreen.getGuiLeft();
                          int guiTop = invScreen.getGuiTop();
                          int panelX = Math.max(6, guiLeft - 76);
                          int panelY = guiTop + 8;

                          drawTarkovHealthWidget(event.getGuiGraphics(), panelX, panelY, time, false);
                      }
                  }

                  // =========================================================================
                  // 2. ВЕРХНИЙ RPG-КОМПАС, ВЫСОТОМЕР И ПОКАЗ ТАРКОВ-ХУДА ПО ЗАЖАТИЮ КЛАВИШИ H
                  // =========================================================================
                  @SubscribeEvent
                  public static void onRenderGuiOverlay(RenderGuiOverlayEvent.Post event) {
                      if (event.getOverlay() != VanillaGuiOverlay.HOTBAR.type()) return;
                      Minecraft mc = Minecraft.getInstance();
                      if (mc.player == null || mc.options.hideGui) return;

                      GuiGraphics gui = event.getGuiGraphics();
                      float time = mc.player.tickCount + event.getPartialTick();
                      int screenW = mc.getWindow().getGuiScaledWidth();
                      int screenH = mc.getWindow().getGuiScaledHeight();

                      // Верхний RPG-компас и Высотомер
                      drawRpgCompassAndAltimeter(gui, mc.player, screenW, time);

                      // Баннер покорения вершины при установке флагштока
                      if (summitBannerTicks > 0) {
                          drawSummitConqueredBanner(gui, screenW, screenH, time);
                      }

                      // На основном экране Тарковский био-сканер скрыт и появляется ТОЛЬКО при удерживании клавиши H
                      if (KEY_INSPECT_HEALTH != null && KEY_INSPECT_HEALTH.isDown()) {
                          drawTarkovHealthWidget(gui, 12, 12, time, true);
                      }
                  }

                  private static void drawTarkovHealthWidget(GuiGraphics gui, int posX, int posY, float time, boolean tilt3D) {
                      PoseStack pose = gui.pose();
                      pose.pushPose();
                      pose.translate((float) posX, (float) posY, 200.0f);
                      if (tilt3D) {
                          pose.mulPose(Axis.YP.rotationDegrees(7.0f));
                          pose.mulPose(Axis.ZP.rotationDegrees(-1.0f));
                      }

                      gui.fill(0, 0, 68, 108, 0xCC080B0E);
                      for (int gy = 8; gy < 100; gy += 8) {
                          gui.fill(2, gy, 66, gy + 1, 0x1A2E4052);
                      }
                      for (int gx = 8; gx < 64; gx += 8) {
                          gui.fill(gx, 2, gx + 1, 104, 0x1A2E4052);
                      }

                      int frameCol = isGusting ? 0xFFFF3838 : 0xFF425466;
                      gui.fill(0, 0, 12, 2, frameCol);
                      gui.fill(0, 0, 2, 12, frameCol);
                      gui.fill(56, 0, 68, 2, frameCol);
                      gui.fill(66, 0, 68, 12, frameCol);
                      gui.fill(0, 106, 12, 108, frameCol);
                      gui.fill(0, 96, 2, 108, frameCol);
                      gui.fill(56, 106, 68, 108, frameCol);
                      gui.fill(66, 96, 68, 108, frameCol);

                      drawAnatomicalHead(gui, 28, 5, headHealth, time);
                      drawAnatomicalTorso(gui, 22, 20, 24, 18, thoraxHealth, true, time);
                      drawAnatomicalTorso(gui, 24, 39, 20, 13, stomachHealth, false, time);
                      drawAnatomicalArm(gui, 10, 21, false, LIMBS[1], time);
                      drawAnatomicalArm(gui, 47, 21, true, LIMBS[0], time);
                      drawAnatomicalLeg(gui, 22, 53, false, LIMBS[3], time);
                      drawAnatomicalLeg(gui, 36, 53, true, LIMBS[2], time);

                      int ecgY = 92;
                      float pulseSpeed = 0.45f + (1.0f - stamina / 100.0f) * 0.65f + (bloodLoss * 0.01f);
                      int sweepX = (int) ((time * 8.0f * pulseSpeed) % 56);
                      for (int x = 0; x < 56; x++) {
                          int dist = Math.abs(x - sweepX);
                          int yOffset = 0;
                          if (dist == 1) yOffset = -3;
                          else if (dist == 0) yOffset = 4;
                          else if (dist == 2) yOffset = 1;
                          int alpha = dist < 14 ? (255 - dist * 14) : 70;
                          int ecgCol = (alpha << 24) | (bloodLoss > 35f ? 0xFF3A3A : 0x38F296);
                          gui.fill(6 + x, ecgY + yOffset, 7 + x, ecgY + yOffset + 1, ecgCol);
                      }

                      gui.fill(6, 98, 62, 101, 0xFF14191F);
                      int stamW = (int) (56.0f * (stamina / 100.0f));
                      int stamCol = stamina < 25.0f ? 0xFFE63946 : 0xFF2EC4B6;
                      gui.fill(6, 98, 6 + stamW, 101, stamCol);

                      gui.fill(6, 103, 62, 105, 0xFF14191F);
                      int chalkW = (int) (56.0f * (chalkLevel / 100.0f));
                      gui.fill(6, 103, 6 + chalkW, 105, 0xFFE8EEF2);

                      pose.popPose();
                  }

                  private static void drawRpgCompassAndAltimeter(GuiGraphics gui, Player player, int screenW, float time) {
                      Minecraft mc = Minecraft.getInstance();
                      int compW = 190;
                      int compH = 22;
                      int cx = screenW / 2;
                      int x0 = cx - compW / 2;
                      int y0 = 8;

                      gui.fill(x0, y0, x0 + compW, y0 + compH, 0xB0090D12);
                      gui.renderOutline(x0, y0, compW, compH, 0xFF3B4D5E);
                      gui.fill(x0, y0, x0 + 8, y0 + 2, 0xFF38E8FF);
                      gui.fill(x0 + compW - 8, y0, x0 + compW, y0 + 2, 0xFF38E8FF);

                      float rawYaw = Mth.wrapDegrees(player.getViewYRot(1.0f));
                      float bearing = (rawYaw + 180.0f) % 360.0f;
                      if (bearing < 0) bearing += 360.0f;

                      for (int deg = 0; deg < 360; deg += 15) {
                          float diff = Mth.wrapDegrees(deg - bearing);
                          if (Math.abs(diff) <= 78.0f) {
                              int px = cx + (int) (diff * 1.15f);
                              boolean major = (deg % 45 == 0);
                              gui.fill(px, y0 + (major ? 2 : 4), px + 1, y0 + (major ? 8 : 7), major ? 0xFFE2E8F0 : 0xFF64748B);

                              String label = null;
                              int col = 0xFFE2E8F0;
                              if (deg == 0) { label = "N"; col = 0xFFFF4D4D; }
                              else if (deg == 45) label = "NE";
                              else if (deg == 90) { label = "E"; col = 0xFF38E8FF; }
                              else if (deg == 135) label = "SE";
                              else if (deg == 180) { label = "S"; col = 0xFF38E8FF; }
                              else if (deg == 225) label = "SW";
                              else if (deg == 270) { label = "W"; col = 0xFF38E8FF; }
                              else if (deg == 315) label = "NW";

                              if (label != null) {
                                  gui.drawCenteredString(mc.font, label, px, y0 + 10, col);
                              }
                          }
                      }

                      if (!PLACED_FLAGS.isEmpty()) {
                          Vec3 lastFlag = PLACED_FLAGS.get(PLACED_FLAGS.size() - 1);
                          double dx = lastFlag.x - player.getX();
                          double dz = lastFlag.z - player.getZ();
                          float flagYaw = (float) (Mth.atan2(dz, dx) * (180.0 / Math.PI)) - 90.0f;
                          float flagBearing = (Mth.wrapDegrees(flagYaw) + 180.0f) % 360.0f;
                          if (flagBearing < 0) flagBearing += 360.0f;
                          float diff = Mth.wrapDegrees(flagBearing - bearing);
                          if (Math.abs(diff) <= 82.0f) {
                              int fx = cx + (int) (diff * 1.15f);
                              gui.fill(fx - 2, y0 + 2, fx + 2, y0 + 7, 0xFFFFD700);
                          }
                      }

                      gui.fill(cx - 2, y0, cx + 3, y0 + 3, 0xFFFFB703);
                      gui.fill(cx, y0 + 3, cx + 1, y0 + 6, 0xFFFFB703);

                      int altX = x0 + compW + 6;
                      int altW = 98;
                      gui.fill(altX, y0, altX + altW, y0 + compH, 0xB0090D12);
                      gui.renderOutline(altX, y0, altW, compH, 0xFF3B4D5E);
                      gui.fill(altX + altW - 6, y0, altX + altW, y0 + 2, 0xFF38F296);

                      int currentAlt = (int) Math.round(player.getY());
                      String altStr = String.format("§7ВЫС: §f%d м", currentAlt);
                      String climbedStr = String.format("§7ВВЕРХ: §a+%.1f м", totalVerticalMetersClimbed);

                      gui.drawString(mc.font, altStr, altX + 5, y0 + 3, 0xFFFFFF, true);
                      gui.drawString(mc.font, climbedStr, altX + 5, y0 + 12, 0xFFFFFF, true);
                  }

                  private static void drawSummitConqueredBanner(GuiGraphics gui, int screenW, int screenH, float time) {
                      Minecraft mc = Minecraft.getInstance();
                      int bw = 260;
                      int bh = 54;
                      int bx = screenW / 2 - bw / 2;
                      int by = 42;

                      gui.fill(bx, by, bx + bw, by + bh, 0xD80B131E);
